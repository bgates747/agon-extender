y="522" font-size="11" fill="#202428" text-anchor="end">GPIO25</text><text x="180" y="552" font-size="12" fill="#202428" text-anchor="end">23</text><text x="210" y="552" font-size="11" fill="#202428" text-anchor="start">GPIO11</text><text x="420" y="552" font-size="12" fill="#202428" text-anchor="start">24</text><text x="390" y="552" font-size="11" fill="#202428" text-anchor="end">GPIO8</text><text x="180" y="582" font-size="12" fill="#202428" text-anchor="end">25</text><text x="210" y="582" font-size="11" fill="#202428" text-anchor="start">GND</text><text x="420" y="582" font-size="12" fill="#202428" text-anchor="start">26</text><text x="390" y="582" font-size="11" fill="#202428" text-anchor="end">GPIO7</text><text x="180" y="612" font-size="12" fill="#202428" text-anchor="end">27</text><text x="210" y="612" font-size="11" fill="#202428" text-anchor="start">GPIO0</text><text x="420" y="612" font-size="12" fill="#202428" text-anchor="start">28</text><text x="390" y="612" font-size="11" fill="#202428" text-anchor="end">GPIO1</text><text x="180" y="642" font-size="12" fill="#202428" text-anchor="end">29</text><text x="210" y="642" font-size="11" fill="#202428" text-anchor="start">GPIO5</text><text x="420" y="642" font-size="12" fill="#202428" text-anchor="start">30</text><text x="390" y="642" font-size="11" fill="#202428" text-anchor="end">GND</text><text x="180" y="672" font-size="12" fill="#202428" text-anchor="end">31</text><text x="210" y="672" font-size="11" fill="#202428" text-anchor="start">GPIO6</text><text x="420" y="672" font-size="12" fill="#202428" text-anchor="start">32</text><text x="390" y="672" font-size="11" fill="#202428" text-anchor="end">GPIO12</text><text x="180" y="702" font-size="12" fill="#202428" text-anchor="end">33</text><text x="210" y="702" font-size="11" fill="#202428" text-anchor="start">GPIO13</text><text x="420" y="702" font-size="12" fill="#202428" text-anchor="start">34</text><text x="390" y="702" font-size="11" fill="#202428" text-anchor="end">GND</text><text x="180" y="732" font-size="12" fill="#202428" text-anchor="end">35</text><text x="210" y="732" font-size="11" fill="#202428" text-anchor="start">GPIO19</text><text x="420" y="732" font-size="12" fill="#202428" text-anchor="start">36</text><text x="390" y="732" font-size="11" fill="#202428" text-anchor="end">GPIO16</text><text x="180" y="762" font-size="12" fill="#202428" text-anchor="end">37</text><text x="210" y="762" font-size="11" fill="#202428" text-anchor="start">GPIO26</text><text x="420" y="762" font-size="12" fill="#202428" text-anchor="start">38</text><text x="390" y="762" font-size="11" fill="#202428" text-anchor="end">GPIO20</text><text x="180" y="792" font-size="12" fill="#202428" text-anchor="end">39</text><text x="210" y="792" font-size="11" fill="#202428" text-anchor="start">GND</text><text x="420" y="792" font-size="12" fill="#202428" text-anchor="start">40</text><text x="390" y="792" font-size="11" fill="#202428" text-anchor="end">GPIO21</text><rect x="840" y="190" width="580" height="330" rx="8" fill="#e9f2e7" stroke="#63707a" stroke-width="2" /><text x="870" y="225" font-size="25" fill="#202428" font-weight="bold">Olimex ESP8266 module</text><text x="870" y="255" font-size="20" fill="#b71c1c">UEXT 1 — 3.3V power</text><text x="870" y="295" font-size="20" fill="#202428">UEXT 2 — GND</text><text x="870" y="355" font-size="20" fill="#1b6b36">UEXT 3 — RXD (module receives)</text><text x="870" y="405" font-size="20" fill="#a44b00">UEXT 4 — TXD (module transmits)</text><text x="870" y="450" font-size="18" fill="#202428">Use connector labels / keyed pin-1 marking.</text><text x="870" y="480" font-size="17" fill="#202428">Terminal order here is logical, not a socket view.</text><polyline points="193,218 105,218 105,106 770,106 770,250 840,250" fill="none" stroke="#c62828" stroke-width="4" stroke-linejoin="round" stroke-dasharray="10 6" /><polyline points="407,278 610,278 610,290 840,290" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round" /><polyline points="407,308 670,308 670,350 840,350" fill="none" stroke="#238b45" stroke-width="4" stroke-linejoin="round" /><polyline points="840,400 720,400 720,338 407,338" fill="none" stroke="#ef7d00" stroke-width="4" stroke-linejoin="round" /><text x="470" y="240" font-size="18" fill="#b71c1c">Pin 1: proposed 3V3 supply</text><text x="470" y="266" font-size="16" fill="#202428">Pin 6: new modem ground</text><text x="470" y="325" font-size="17" fill="#1b6b36">Pin 8: Pi TX → modem RX</text><text x="470" y="370" font-size="17" fill="#a44b00">Pin 10: Pi RX ← modem TX</text><rect x="815" y="560" width="760" height="210" rx="8" fill="#fff6df" stroke="#b8860b" stroke-width="2" /><text x="840" y="594" font-size="23" fill="#202428" font-weight="bold">Power check before energizing</text><text x="840" y="627" font-size="18" fill="#202428">Pi has 3V3 supply pins 1 and 17. Proposed modem feed: pin 1.</text><text x="840" y="658" font-size="18" fill="#202428">Confirm ≥500 mA-capable spare 3V3 supply and module polarity.</text><text x="840" y="689" font-size="18" fill="#202428">If unverified: draw a Pi-5V-fed regulator alternative first.</text><text x="840" y="720" font-size="18" fill="#202428">Disconnect all four old P4 modem wires; never join supplies.</text><rect x="800" y="820" width="800" height="270" rx="8" fill="#edf0f2" stroke="#63707a" stroke-width="2" /><text x="825" y="855" font-size="24" fill="#202428" font-weight="bold">Existing Olimex reset circuit — leave intact</text><polyline points="193,368 128,368 128,910 860,910" fill="none" stroke="#546e7a" stroke-width="3" stroke-linejoin="round" /><rect x="860" y="892" width="100" height="34" rx="8" fill="white" stroke="#63707a" stroke-width="2" /><text x="910" y="915" font-size="18" fill="#202428" text-anchor="middle">10 kΩ</text><polyline points="960,910 1050,910" fill="none" stroke="#546e7a" stroke-width="3" stroke-linejoin="round" /><text x="825" y="884" font-size="17" fill="#455a64">Physical 11 / GPIO17</text><text x="1070" y="915" font-size="18" fill="#202428">Existing transistor base</text><polyline points="193,338 72,338 72,1000 1080,1000" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" /><text x="825" y="1033" font-size="18" fill="#202428">Physical 9 / GND → existing emitter + common ground</text><text x="1070" y="953" font-size="18" fill="#202428">Collector → Olimex RST/EN</text><text x="825" y="1070" font-size="18" fill="#202428" font-weight="bold">Neither pin 9 nor pin 11 is borrowed for the modem.</text><text x="160" y="875" font-size="16" fill="#202428">Header view reused from BYTE Pi5/WROOM artwork.</text><text x="160" y="900" font-size="16" fill="#202428">Old WROOM bus wires are archival, not current wiring.</text><text x="160" y="935" font-size="22" fill="#202428" font-weight="bold">USB / Ethernet end ↓</text><text x="160" y="967" font-size="17" fill="#202428">Check physical pin 1; underside/socket views mirror.</text><text x="42" y="1140" font-size="17" fill="#202428">Only the shown connections are proposed/retained. Other header pins are not declared free. No hardware was changed.</text></svg>