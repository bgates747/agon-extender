  <text x="180" y="222" font-size="12" fill="#202428" text-anchor="end">1</text><text x="210" y="222" font-size="11" fill="#202428" text-anchor="start">3V3</text><circle cx="193" cy="218" r="8" fill="white" stroke="#c62828" stroke-width="3" /><text x="420" y="222" font-size="12" fill="#202428" text-anchor="start">2</text><text x="390" y="222" font-size="11" fill="#202428" text-anchor="end">5V</text><text x="180" y="252" font-size="12" fill="#202428" text-anchor="end">3</text><text x="210" y="252" font-size="11" fill="#202428" text-anchor="start">GPIO2</text><text x="420" y="252" font-size="12" fill="#202428" text-anchor="start">4</text><text x="390" y="252" font-size="11" fill="#202428" text-anchor="end">5V</text><text x="180" y="282" font-size="12" fill="#202428" text-anchor="end">5</text><text x="210" y="282" font-size="11" fill="#202428" text-anchor="start">GPIO3</text><text x="420" y="282" font-size="12" fill="#202428" text-anchor="start">6</text><text x="390" y="282" font-size="11" fill="#202428" text-anchor="end">GND</text><circle cx="407" cy="278" r="8" fill="white" stroke="#111" stroke-width="3" /><text x="180" y="312" font-size="12" fill="#202428" text-anchor="end">7</text><text x="210" y="312" font-size="11" fill="#202428" text-anchor="start">GPIO4</text><text x="420" y="312" font-size="12" fill="#202428" text-anchor="start">8</text><text x="390" y="312" font-size="11" fill="#202428" text-anchor="end">GPIO14 TX</text><circle cx="407" cy="308" r="8" fill="white" stroke="#238b45" stroke-width="3" /><text x="180" y="342" font-size="12" fill="#202428" text-anchor="end">9</text><text x="210" y="342" font-size="11" fill="#202428" text-anchor="start">GND reset</text><circle cx="193" cy="338" r="8" fill="white" stroke="#111" stroke-width="3" /><text x="420" y="342" font-size="12" fill="#202428" text-anchor="start">10</text><text x="390" y="342" font-size="11" fill="#202428" text-anchor="end">GPIO15 RX</text><circle cx="407" cy="338" r="8" fill="white" stroke="#ef7