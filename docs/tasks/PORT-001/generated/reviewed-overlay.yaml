  label: Debug Zdi And File Transfer
  build_selection: selected
  locations: []
  evidence_ids:
  - evidence:source:agon-vdp:video.ino:71:abeadac6eece
  - evidence:source:agon-vdp:video.ino:104:8ec315fbd7ae
  - evidence:source:agon-vdp:agon_ps2.h:105:5a780bb94877
  - evidence:source:agon-vdp:agon_ps2.h:109:81d9b9479f59
  - evidence:source:agon-vdp:hexload.h:34:24a7cda3d17b
  - evidence:source:agon-vdp:zdi.h:10:05a55b6601e2
  - evidence:source:agon-vdp:zdi.h:12:662f84fecbc8
  - evidence:source:agon-vdp:ymodem.h:241:b2d108cd7aee
  - evidence:source:agon-vdp:ymodem.h:438:cad7fb6a13a2
  properties:
    review.runtime_status: command-or-console-activated
    review.portability_boundary: 'These maintenance paths are separate from normal VDU rendering but are not a single subsystem: debug UART, ZDI GPIO, keyboard abort/entry logic, CRC, PSRAM, and the primary VDP packet stream are cross-coupled. YMODEM stores transfer files in memory; it does not use a local filesystem.'
- id: subsystem:agon-vdp:dependency-source-selection
  kind: subsystem
  owner: agon-vdp
  label: Dependency Source Selection
  build_selection: selected
  locations: []
  evidence_ids:
  - evidence:source:agon-vdp:video.ino:49:f9f3aaba6280
  - evidence:source:agon-vdp:video.ino:50:738515d0a36d
  - evidence:source:vdp-gl:fabgl.h:311:ee40414bcff1
  - evidence:source:vdp-gl:fabgl.h:322:a0b65d1a6421
  - evidence:source:vdp-gl:fabgl.h:326:2d5ff4f17d56
  - evidence:source:vdp-gl:fabutils.h:45:59853a0b7065
  properties:
    review.runtime_status: build-time-selection-with-mixed-runtime-reachability
    review.portability_boundary: Build inclusion, header coupling, and runtime ownership are three separate facts. A compiled dependency translation unit can fail on P4 without being part of the official runtime, while a shared header can still block preprocessing even when its particular driver is unused. The missing soc/frc_timer_reg.h is on FabGL's broad fabutils.h path and therefore cannot be dismissed solely as an unused-driver failure.
