    claim: RTC commands and responses follow the accepted clock-authority and MOS-sysvar policy without competing writers.
    mode_ids: [mode:extender:edp-exclusive, mode:extender:cooperative]
    owner_task_ids: [SETUP-005]
    requirement_refs: [AUDIT-001-C13]
    blocker_refs: [SETUP-005-D008]
    implementation_state: not-started
    qualification_state: blocked
  - id: obligation:extender:wired-ethernet-backend
