    kind: mos-state
    claim: MOS sends the official General Poll and receives the unchanged response through its selected parser, completing startup synchronization.
    mode_ids: [mode:extender:edp-exclusive]
    owner_task_ids: [PORT-008]
    requirement_refs: [AUDIT-001-C04]
    blocker_refs: [SETUP-005-D003, PORT-003-PHASE-E]
    implementation_state: not-started
    qualification_state: blocked
  - id: obligation:extender:vdu-23-0-x87-rtc-authority
    scope: compatibility-critical
    subject_kind: interface
    subject_id: interface:agon-vdp:vdu-23-0-x87
