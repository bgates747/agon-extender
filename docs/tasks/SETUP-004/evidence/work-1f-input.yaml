  - id: input-official-compatibility-integration
    name: Official VDP keyboard/mouse protocol, event, state, and cursor integration
    layer: Header-defined official VDP input integration
    scope: Keyboard and mouse command parsing, event variables, packets, callbacks, control-key and paged-mode behavior, logical mouse position, cursor selection and custom cursor bitmaps; excludes physical PS/2 acquisition and unresolved processor/MOS routing.
    upstream_owner: agon-vdp
    source_highlights: [agon-vdp:video/agon_ps2.h, agon-vdp:video/vdu_sys.h, agon-vdp:video/vdu_stream_processor.h, agon-vdp:video/vdu_sprites.h, agon-vdp:video/vdp_variables.h, agon-vdp:video/video.ino]
    implementation_highlights:
      selected_translation_units: [agon-vdp:video/video.ino]
      header_implementation: [agon-vdp:video/agon_ps2.h, agon-vdp:video/vdu_sys.h, agon-vdp:video/vdu_stream_processor.h, agon-vdp:video/vdu_sprites.h, agon-vdp:video/vdp_variables.h]
    facilities: [keyboard locale repeat LED control and key polling, mouse enable reset position parameters and cursor commands, PACKET_KEYCODE PACKET_KEYSTATE and PACKET_MOUSE, keyboard and mouse callbacks, VDP input variables and event queue, control-key dispatch, paged-mode resume, display cursor state and custom cursor bitmaps]
    activation: [processLoop unconditionally calls setupKeyboardAndMouse., Every processNext iteration drains events and calls handleKeyboardAndMouse., System keyboard/mouse commands call helpers in agon_ps2.h., Mode changes and sprite command &40 update mouse cursor state.]
    connections:
      startup: [setupKeyboardAndMouse from processLoop]
      tasks: [processLoop polling; physical device tasks through direct FabGL objects]
      interrupts: [indirect upstream PS/2 ULP and RTC interrupt acquisition]
      timers: [keyboard typematic and mouse timing inside direct FabGL objects]
      callbacks: [CALLBACK_KEYBOARD, CALLBACK_MOUSE, CALLBACK_SENDING_VDPP and CALLBACK_SENT_VDPP for key mouse and key-state packets]
      global_state: [_keycode, kbRepeatDelay, kbRepeatRate, kbRegion, kbEnabled, mouseEnabled, mouseVisible, mouse parameters, mouseCursors, mCursor, VDP input variables, eventQueue]
    visible_behavior: [Consumes all keyboard and mouse command bytes in the accepted inventory., Exclusive compatibility mode requires stock key mouse and key-state packet formats callbacks event variables control-key behavior paged-mode behavior and display-local cursor effects., Cooperative mode routing and ownership remain unresolved., Legacy mode leaves all behavior with the onboard VDP.]
    target_compatibility:
      status: required-behavior-fused-to-excluded-device-objects
      finding: The parser, packet, callback, VDP-variable, control-key, and cursor behavior is required for later compatibility profiles, but official helpers directly acquire global FabGL Keyboard and Mouse objects and start PS2Controller. The proof-of-concept adapter accepts processed input explicitly forwarded by an EDU-aware eZ80 application, updates EDP-local state and behavior, and does not re-emit the same stock input packets by default; any more transparent v1 route remains open under SETUP-005-D007.
      evidence: [target:p4-input-soc-caps]
    physical_owner_class: shared
    physical_owner: The onboard VDP owns Rev 1 physical input while Extender owns the EDP-local compatibility state and display effects required in EDP-exclusive operation
    author_review: {status: accepted, decision_date: 2026-08-22}
    disposition: replace
    rationale: Preserve the complete code and semantics needed by later compatibility profiles while replacing the inseparable direct PS/2 device bindings with a project-owned injection adapter. The proof of concept uses explicit aware-application forwarding and suppresses automatic packet echo; literal retention contradicts the accepted physical-owner boundary and omission prevents even aware applications from supplying display-local input.
    omission_fallout: Direct omission removes command consumers packet generation callbacks input variables control-key and paged-mode behavior and cursor integration from the effective video.ino unit; replacement must satisfy those seams before physical drivers are filtered.
    dependencies: [SETUP-005-D007]
    dependency_effects: [{id: SETUP-005-D007, effect: blocks-implementation}]
    fallout_analysis: {kind: replace-fused-input-integration, first_failure: Removing agon_ps2.h or its FabGL objects breaks startup processNext system commands VDP variables mode changes and sprite cursor command &40., selected_consumers: mechanical.source_roles.inbound_consumers, severance: Preserve official parsers state packets callbacks and display effects behind a project-owned processed-event injection adapter initially driven by aware applications., residual_risk: Any transparent v1 routing sysvar ownership event ordering and failure behavior remain unresolved in SETUP-005-D007.}
    evidence_ids: [evidence:reviewed:facility-physical-ps2-input-0]
