  - id: input-vdp-gl-physical-ps2-controller
    name: vdp-gl ESP32 ULP-backed physical PS/2 controller
    layer: vdp-gl classic-ESP32 physical acquisition backend
    scope: PS/2 port ownership, RTC GPIO, classic ESP32 ULP program, SENS/RTC registers, RTC interrupt, ISR/task/queue handoff, and Keyboard/Mouse device attachment.
    upstream_owner: vdp-gl
    source_highlights: [vdp-gl:src/comdrivers/ps2controller.cpp, vdp-gl:src/comdrivers/ps2controller.h]
    implementation_highlights: {selected_translation_units: [vdp-gl:src/comdrivers/ps2controller.cpp], header_implementation: [vdp-gl:src/comdrivers/ps2controller.h]}
    facilities: [classic ESP32 ULP finite-state programs, RTC-domain GPIO, SENS and RTC register access, RTC interrupt and FreeRTOS handoff, two physical PS/2 ports]
    activation: [Official setupKeyboardAndMouse unconditionally calls PS2Controller::begin., Keyboard and Mouse objects obtain data through its ports.]
    connections: {startup: [setupKeyboardAndMouse], tasks: [PS2 event processing tasks], interrupts: [RTC interrupt], timers: [], callbacks: [ULP wake and ISR/task handoff], global_state: [two PS2 ports shared ULP memory device pointers and queues]}
    visible_behavior: [No independent VDU surface; supplies physical events that official keyboard and mouse integration turns into packets variables callbacks and cursor behavior.]
    target_compatibility:
      status: incompatible-and-unselected
      finding: The source requires classic ESP32 esp32/ulp.h RTC GPIO SENS registers and ULP macros that are unavailable on P4, and ADR-0013 assigns Rev 1 physical input to the onboard VDP.
