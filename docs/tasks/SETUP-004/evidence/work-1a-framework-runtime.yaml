  - id: framework-primary-vdp-serial-binding
    name: Primary VDP protocol serial binding
    layer: Arduino device API
    scope: >-
      Official binding of the primary VDP protocol stream to Serial2 and its
      underlying Arduino HardwareSerial API; excludes the retained abstract
      Stream contract and the separately inventoried DBGSerial binding.
    upstream_owner: agon-vdp
    source_highlights:
      - agon-vdp:video/video.ino
      - agon-vdp:video/vdp_protocol.h
      - vdp-gl:src/terminal.cpp
    implementation_highlights:
      selected_translation_units:
        - agon-vdp:video/video.ino
      header_implementation:
        - agon-vdp:video/vdp_protocol.h
    facilities:
      - Arduino HardwareSerial
      - Serial2 VDP transport
    activation:
      - setup() calls setupVDPProtocol().
      - VDUStreamProcessor initially uses Serial2 for both command input and packet output.
    connections:
      startup:
        - setupVDPProtocol()
      tasks:
        - processLoop
      interrupts: []
      timers: []
      callbacks:
        - VDPP callback emission
      global_state:
        - VDPSerial
    visible_behavior:
      - Stock VDU input and VDPP output are duplex on Serial2.
      - Unaware legacy applications must continue to default to the regular UART contract.
      - Routing between onboard VDP and EDP may change the endpoint, but not the legacy wire contract.
    target_compatibility:
      status: api-available-mapping-unqualified
      finding: >-
        Arduino-ESP32 3.3.11 provides HardwareSerial on P4, but the official
        Serial2 instance, pin, flow-control, and duplex binding contains
        ESP32-PICO assumptions and is not a usable Extender transport design.
      evidence:
        - target:arduino-hardware-serial
    physical_owner_class: Extender
    physical_owner: Extender forward command transport and UART return transport
    author_review:
      status: accepted
      decision_date: 2026-08-22
    disposition: replace
    rationale: >-
      Rev 1 uses a high-speed forward path for command input and UART for return
      traffic, so the stock single-duplex Serial2 binding cannot remain. UART0
      diagnostics are a separate candidate. Narrow Stream-compatible adapters
      preserve upstream parser semantics. Unaware legacy applications default
      to regular UART, and the unresolved VDP/EDP routing mechanism may change
      the selected endpoint but must not change the legacy wire contract.
    omission_fallout: >-
      Removing the binding without replacements leaves no MOS command ingress
      or VDPP return path.
    dependencies:
      - SETUP-004.1.c
      - SETUP-005-D003
    dependency_effects:
      - id: SETUP-004.1.c
        effect: blocks-implementation
      - id: SETUP-005-D003
        effect: blocks-implementation
    fallout_analysis:
      kind: replacement-required
      first_failure: >-
        Removing VDPSerial first breaks compilation at its direct consumers;
        retaining it unchanged binds command ingress and return packets to the
        wrong UART ownership and pins.
      selected_consumers: mechanical.source_roles.inbound_consumers
      severance: >-
        Preserve Stream-facing contracts and replace primary VDPSerial with
        explicit forward-input and UART-return adapters.
      residual_risk: Transport ownership remains blocked by SETUP-004.1.c and SETUP-005-D003.
    evidence_ids:
      - evidence:source:agon-vdp:vdp_protocol.h:17:507e0a51692b
      - evidence:source:agon-vdp:vdp_protocol.h:26:5f52aa9326ab
    graph_node_ids:
      - function:agon-vdp:setupVDPProtocol()
      - macro:agon-vdp:VDPSerial@video/vdp_protocol.h%23variant-dbcd3c44de4c
      - platform-api:reviewed:arduino%20hardwareserial
    agent_entry_points:
