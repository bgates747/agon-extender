records:
  - id: framework-arduino-sketch-lifecycle
    name: Arduino sketch lifecycle and top-level startup
    layer: Arduino runtime
    scope: >-
      Arduino-provided app_main dispatch into upstream-shaped setup() and
      loop(), plus the VDP-owned startup ordering in video.ino.
    upstream_owner: agon-vdp
    source_highlights:
      - agon-vdp:video/video.ino
    implementation_highlights:
      selected_translation_units:
        - agon-vdp:video/video.ino
      header_implementation: []
    facilities:
      - Arduino setup()/loop() lifecycle
      - Arduino delay()
      - VDP-owned startup orchestration
    activation:
      - setup() runs unconditionally at firmware startup.
      - setup() initializes display, transport, processLoop, audio, and the boot screen.
      - loop() intentionally sleeps forever after setup.
    connections:
      startup:
        - setup()
        - loop()
      tasks:
        - processLoop
      interrupts: []
      timers: []
      callbacks: []
      global_state:
        - processor
        - Core0Task
        - Terminal
    visible_behavior:
      - Every normally processed VDU command depends on successful startup and processLoop activation.
      - Startup ordering determines when transport and visible output become available.
    target_compatibility:
      status: physically-qualified
      finding: >-
        Arduino-ESP32 3.3.11 supplies the sketch dispatcher, and the P4 canary
        qualified setup()/loop() startup under the accepted hybrid framework.
      evidence:
        - target:arduino-core
        - target:arduino-lifecycle
        - docs/procedures/p4-canary-r03.md
    physical_owner_class: Extender
    physical_owner: Extender P4 firmware runtime
    author_review:
      status: accepted
      decision_date: 2026-08-21
    disposition: retain
    rationale: >-
      The accepted hybrid framework deliberately preserves Arduino lifecycle
      idioms and the physical canary qualified Arduino autostart on the P4.
      Startup contents still require subsystem-specific adaptation.
    omission_fallout: >-
      Omitting the lifecycle or setup path removes all normal command
      processing; replacing it with a pure ESP-IDF app_main would create an
      unnecessary upstream structural divergence.
    dependencies:
      - SETUP-004.1.b
      - SETUP-004.1.c
      - SETUP-004.1.d
      - SETUP-004.1.e
      - SETUP-004.1.f
    dependency_effects:
