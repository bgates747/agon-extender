        because its ESP-IDF 4-era two-argument esp_task_wdt_init() call is not
        valid in ESP-IDF 5.5.5. Blind removal also changes reset and hang policy.
      selected_consumers: mechanical.source_roles.inbound_consumers
      severance: >-
