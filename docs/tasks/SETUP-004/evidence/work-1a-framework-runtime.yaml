  - id: framework-debug-serial-binding
    name: DBGSerial maintenance and operator binding
    layer: Arduino device API
    scope: >-
      Official UART0 DBGSerial object and its printer, console, diagnostic,
      keyboard-debug, ZDI, Intel HEX, YMODEM, and updater consumers; excludes
      the separately inventoried primary VDP protocol transport.
    upstream_owner: agon-vdp
    source_highlights:
      - agon-vdp:video/video.ino
      - agon-vdp:video/agon_ps2.h
      - agon-vdp:video/hexload.h
      - agon-vdp:video/vdu.h
      - agon-vdp:video/ymodem.h
      - agon-vdp:video/zdi.h
    implementation_highlights:
      selected_translation_units:
        - agon-vdp:video/video.ino
      header_implementation:
        - agon-vdp:video/agon_ps2.h
        - agon-vdp:video/hexload.h
        - agon-vdp:video/vdu.h
        - agon-vdp:video/ymodem.h
        - agon-vdp:video/zdi.h
    facilities:
      - Arduino HardwareSerial UART0
      - DBGSerial
    activation:
      - setup() initializes DBGSerial on UART0.
      - Console, printer, ZDI, HEX load, YMODEM, and debug-keyboard paths consume DBGSerial.
    connections:
      startup:
        - DBGSerial.begin()
      tasks:
        - processLoop
      interrupts: []
      timers: []
      callbacks: []
      global_state:
        - DBGSerial
    visible_behavior:
      - Debug, printer, console, transfer, ZDI, and debug-keyboard behavior assumes UART0 availability.
      - Extender v1 does not provide these DBGSerial-owned maintenance/operator facilities.
      - Legacy mode leaves Extender absent and preserves stock facilities through the onboard VDP.
      - Cooperative mode may reach onboard facilities through ordinary VDU routing.
      - EDP-exclusive handling depends on the strict compatibility contract selected for that mode.
    target_compatibility:
      status: api-available-mapping-unqualified
      finding: >-
        Arduino-ESP32 3.3.11 provides HardwareSerial on P4, but the upstream
        UART0 binding is an ESP32-PICO maintenance-port assumption and is not a
        selected Extender v1 facility.
      evidence:
        - target:arduino-hardware-serial
    physical_owner_class: onboard VDP
    physical_owner: Onboard VDP in legacy and applicable cooperative operation; none on Extender v1
    author_review:
      status: accepted
