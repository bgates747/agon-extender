  - id: framework-arduino-stream-contract
    name: Arduino Stream and Print-compatible byte-stream contract
    layer: Arduino core API
    scope: >-
      Abstract byte-stream interfaces used by VDUStreamProcessor and the
      in-memory BufferStream/MultiBufferStream implementations; excludes the
      concrete UART binding.
    upstream_owner: agon-vdp
    source_highlights:
      - agon-vdp:video/vdu_stream_processor.h
      - agon-vdp:video/buffer_stream.h
      - agon-vdp:video/multi_buffer_stream.h
    implementation_highlights:
      selected_translation_units:
        - agon-vdp:video/video.ino
      header_implementation:
        - agon-vdp:video/vdu_stream_processor.h
        - agon-vdp:video/buffer_stream.h
        - agon-vdp:video/multi_buffer_stream.h
    facilities:
      - Arduino Stream
      - Arduino Print through Stream
      - shared input and output stream ownership
      - temporary stream substitution for buffered command execution
    activation:
      - VDUStreamProcessor is constructed over a Stream during setup.
      - Normal command reads and protocol packet writes use the active streams.
      - Buffered command execution can substitute in-memory Stream implementations.
    connections:
      startup:
        - VDUStreamProcessor constructor
      tasks:
        - processLoop
      interrupts: []
      timers: []
      callbacks:
        - buffered command callbacks
      global_state:
        - VDUStreamProcessor::inputStream
        - VDUStreamProcessor::outputStream
        - VDUStreamProcessor::originalOutputStream
    visible_behavior:
      - VDU parsing consumes an ordered byte stream independent of its physical transport.
      - VDPP responses and callbacks write through the active output stream.
      - Buffered commands depend on reusable in-memory stream semantics.
    target_compatibility:
      status: source-confirmed
      finding: >-
        Arduino-ESP32 3.3.11 retains the Stream/Print inheritance contract used
        by the parser, packet writer, and in-memory stream implementations.
      evidence:
        - target:arduino-stream
    physical_owner_class: Extender
    physical_owner: Extender P4 firmware runtime
    author_review:
      status: accepted
      decision_date: 2026-08-21
    disposition: retain
    rationale: >-
      Stream is the principal existing seam between VDP semantics and physical
      transport. Retaining it minimizes upstream changes and supports separate
      forward-command and UART-return adapters.
    omission_fallout: >-
      Removing Stream requires invasive rewrites across parser input, packet
      output, buffered execution, updater, transfer, and terminal paths.
    dependencies:
      - SETUP-004.1.c
      - SETUP-005-D003
    dependency_effects:
      - id: SETUP-004.1.c
        effect: blocks-implementation
      - id: SETUP-005-D003
        effect: blocks-implementation
    evidence_ids:
      - evidence:reviewed:facility-primary-vdp-transport-0
      - evidence:source:agon-vdp:vdu_stream_processor.h:261:1746dee96818
      - evidence:source:agon-vdp:vdu_stream_processor.h:516:0a82ff96deba
    graph_node_ids:
