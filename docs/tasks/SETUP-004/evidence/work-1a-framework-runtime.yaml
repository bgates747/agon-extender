    rationale: >-
      Preserve the intent—long-running VDP tasks remain schedulable and
      supervised—but replace inherited global watchdog disabling and ESP32-era
      core assumptions with one explicit P4 task/watchdog policy. Activation
      and workload are mode-aware, while strict compatibility applies to
      externally observable reset/failure behavior rather than obsolete
      internals. Portable FreeRTOS pinning remains available where measurement
      justifies it.
    omission_fallout: >-
