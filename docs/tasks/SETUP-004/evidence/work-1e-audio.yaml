  - id: audio-classic-esp32-physical-output
    name: FabGL classic-ESP32 DAC, sigma-delta, DMA, timer, and ISR output paths
    layer: Fused vdp-gl hardware output backend
    scope: Output-method selection, DAC GPIO defaults, I2S0 register programming, legacy DMA descriptors, DAC enable, ISR-driven sample delivery, sigma-delta GPIO output, esp_timer-driven sample delivery, and host-only SDL callback; excludes waveform and mixing algorithms retained from the same source unit.
    upstream_owner: vdp-gl
    source_highlights: [vdp-gl:src/devdrivers/soundgen.cpp, vdp-gl:src/devdrivers/soundgen.h]
    implementation_highlights:
      selected_translation_units: [vdp-gl:src/devdrivers/soundgen.cpp]
      header_implementation: [vdp-gl:src/devdrivers/soundgen.h]
    facilities: [SoundGenMethod DAC SigmaDelta and Auto selection, classic ESP32 I2S0 registers, built-in DAC on GPIO 25 or 26, legacy lldesc DMA chain, pinned I2S0 ISR, sigma-delta GPIO 23 default, periodic esp_timer callback, conditional SDL host sink]
    activation: [SoundGenerator::play first calls init., Auto selects DAC for VGA and sigma-delta for CVBS., DAC mode fills alternating DMA buffers in the I2S0 ISR., Sigma-delta mode emits one mixed sample per periodic timer callback., FABGL_EMULATED separately opens an SDL audio device.]
    connections:
      startup: [initAudio constructs SoundGenerator and calls play]
      tasks: [esp_timer task dispatches sigma-delta samples]
      interrupts: [I2S0 output-EOF ISR fills DAC DMA buffers]
      timers: [periodic esp_timer at the selected audio sample rate]
      callbacks: [SoundGenerator::timerHandler, conditional SDLAudioCallback]
      global_state: [I2S0 registers, DMA descriptor chain, interrupt handle, timer handle, output method, output GPIO, play state]
    visible_behavior: [Turns mixed samples into stock local mono audio., Output scheduling controls effective sample rate, continuity, latency, underruns, and audio timing., Auto output selection is coupled to the stock VGA/CVBS mode even though Extender replaces those display backends.]
    target_compatibility:
      status: source-incompatible-and-product-output-mismatch
      finding: ESP32-P4 has modern I2S and SDM peripherals but no SOC_DAC_SUPPORTED built-in DAC; the vendored code directly programs classic ESP32 I2S0 registers, uses ESP32-only dac_i2s_enable, legacy lldesc and sigma-delta APIs, fixed classic pins, and a display-mode selector already replaced by Work 1.d. Rev 1 instead requires network/browser audio and selects no local P4 audio hardware.
      evidence: [target:p4-audio-soc-caps, target:p4-sdm-driver, target:p4-i2s-driver, target:p4-deprecated-dac-header]
    physical_owner_class: Extender
    physical_owner: Extender P4 owns replacement PCM scheduling and network delivery; no Rev 1 local audio transducer is selected
    author_review: {status: accepted, decision_date: 2026-08-22}
    disposition: replace
    rationale: Audio output remains required, but none of the stock DAC/sigma-delta physical implementation or VGA/CVBS selection policy fits the target. Replace it with an Extender-owned PCM scheduler and sink seam whose guaranteed Rev 1 consumer is network/browser delivery; logical playback and status timing must remain independent of sink latency or availability.
    omission_fallout: The old physical methods and headers must be omitted from the P4 build path, but soundgen.cpp cannot be excluded wholesale because it also contains retained waveform and mixer code; play, init, teardown, and getSample access require a bounded replacement.
    dependencies: [SETUP-004.1.g, SETUP-005-D005]
    dependency_effects:
      - {id: SETUP-004.1.g, effect: blocks-implementation}
      - {id: SETUP-005-D005, effect: requires-later-qualification}
    fallout_analysis:
      kind: replace-fused-audio-output-backend
      first_failure: Excluding soundgen.cpp removes both incompatible hardware output and required waveform/mixer definitions; merely deleting hardware methods leaves SoundGenerator play, initialization, and teardown unresolved.
      selected_consumers: mechanical.source_roles.inbound_consumers
      severance: Preserve waveform and mixer behavior while introducing an Extender-owned scheduler/sink contract; condition out DAC, sigma-delta, SDL, old DMA/register headers, callbacks, fixed pins, and display-mode Auto selection from the P4 path.
      residual_risk: PCM format, buffering, pacing, clock drift, browser/network backpressure, latency, and exact stock synthesis fidelity require implementation and qualified tests.
    evidence_ids: [evidence:reviewed:facility-audio-2]
    graph_node_ids: ['physical-facility:reviewed:esp32%20i2s0,%20dac,%20sigma-delta,%20dma-capable%20heap,%20interrupts,%20and%20timers']
