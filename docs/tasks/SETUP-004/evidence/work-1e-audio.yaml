  - id: audio-vdp-command-and-channel-runtime
    name: Official VDP audio protocol, channel, envelope, and sample runtime
    layer: Header-defined official VDP audio service
    scope: VDU audio parsing, command acknowledgements, channel state, volume and frequency envelopes, waveform selection, buffer-backed samples, playback timing, and sample-rate control; excludes the final PCM sink and optional onboard-VDP forwarding.
    upstream_owner: agon-vdp
    source_highlights: [agon-vdp:video/agon_audio.h, agon-vdp:video/audio_channel.h, agon-vdp:video/audio_sample.h, agon-vdp:video/enhanced_samples_generator.h, agon-vdp:video/envelopes/adsr.h, agon-vdp:video/envelopes/frequency.h, agon-vdp:video/envelopes/multiphase_adsr.h, agon-vdp:video/envelopes/types.h, agon-vdp:video/vdu_audio.h]
    implementation_highlights:
      selected_translation_units: [agon-vdp:video/video.ino]
      header_implementation: [agon-vdp:video/agon_audio.h, agon-vdp:video/audio_channel.h, agon-vdp:video/audio_sample.h, agon-vdp:video/enhanced_samples_generator.h, agon-vdp:video/envelopes/adsr.h, agon-vdp:video/envelopes/frequency.h, agon-vdp:video/envelopes/multiphase_adsr.h, agon-vdp:video/envelopes/types.h, agon-vdp:video/vdu_audio.h]
    facilities: ['VDU 23,0,&85 parser', PACKET_AUDIO acknowledgements, AudioChannel state machines, volume and frequency envelopes, buffer-backed PCM samples, one-millisecond audio control task, global channel and sample state]
    activation: [setup calls initAudio unconditionally after constructing the VDU stream processor., initAudio constructs the generator, default channels, and pinned audioDriver task., VDU audio commands mutate channels and samples and return status packets., VDU 7 invokes the same note-playing service on channel zero.]
    connections:
      startup: [video.ino setup calls initAudio]
      tasks: [audioDriver polls all enabled AudioChannel instances every millisecond]
      interrupts: []
      timers: [Arduino millis drives note and envelope progression]
      callbacks: [sendAudioStatus invokes buffered callbacks for CALLBACK_SENDING_VDPP plus PACKET_AUDIO before sending each acknowledgement]
      global_state: [soundGeneratorMutex, audioChannels, audioTask, samples, soundGenerator]
    visible_behavior: ['Implements every accepted VDU 23,0,&85 audio command and VDU 7 bell behavior.', Returns two-byte channel/status PACKET_AUDIO acknowledgements over the VDP response path., Channel status, note scheduling, envelopes, sample seek/repeat/rate behavior, and command success or failure are application-visible.]
    target_compatibility:
      status: logical-runtime-retainable-output-binding-requires-adaptation
      finding: Channel, envelope, sample, parser, and task logic use retained C++/Arduino/FreeRTOS/PSRAM services, but the headers construct and manipulate fabgl::SoundGenerator directly and therefore require the output seam selected by W1E-Q02 and W1E-Q03.
      evidence: [target:p4-audio-soc-caps]
    physical_owner_class: Extender
    physical_owner: Extender EDP owns audio command state and generated audio in EDP-active modes; the onboard VDP remains independent in legacy mode
    author_review: {status: accepted, decision_date: 2026-08-22}
    disposition: retain
    rationale: The accepted VDU inventory keeps the complete audio command surface, status packets, channel semantics, samples, and envelopes; retaining the official implementation minimizes upstream merge divergence while isolating only its concrete output dependency.
    omission_fallout: Omission removes all accepted audio commands, acknowledgements, VDU 7 sound, and channel/sample state from the effective video.ino translation unit.
