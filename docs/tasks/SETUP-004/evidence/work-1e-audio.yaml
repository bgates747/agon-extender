  - id: audio-waveform-and-mixer-core
    name: FabGL waveform generation, channel attachment, and PCM mixing core
    layer: vdp-gl logical synthesis and mixing service
    scope: Waveform sample generation, frequency/phase progression, channel attachment and lifetime, channel/global volume, sample-rate propagation, sample playback, and final signed PCM mixing; excludes DAC, sigma-delta, SDL, DMA, timer, and interrupt delivery.
    upstream_owner: vdp-gl
    source_highlights: [vdp-gl:src/devdrivers/soundgen.cpp, vdp-gl:src/devdrivers/soundgen.h]
    implementation_highlights:
      selected_translation_units: [vdp-gl:src/devdrivers/soundgen.cpp]
      header_implementation: [vdp-gl:src/devdrivers/soundgen.h]
    facilities: [WaveformGenerator contract, sine square triangle sawtooth noise and VIC-noise generators, sample generator, attachment list, auto-detach and lifetime rules, signed eight-bit PCM mixer, global volume scaling]
    activation: [Official initAudio constructs SoundGenerator., AudioChannel constructs and attaches one waveform generator per enabled channel., The active output callback repeatedly calls SoundGenerator::getSample., Sample-rate changes reconstruct SoundGenerator and reattach channels.]
    connections:
      startup: [constructed by initAudio]
      tasks: [official audioDriver updates attached waveform state]
      interrupts: [upstream DAC ISR consumes getSample; replacement sink must not make the mixer ISR-specific]
      timers: [upstream sigma-delta timer consumes getSample]
      callbacks: [upstream SDL callback consumes getSample only in emulated builds]
      global_state: [SoundGenerator channel list, sample rate, play state, global volume]
    visible_behavior: [Determines waveform shape, frequency, duration, duty cycle, noise sequence, sample playback, channel mixing, clipping/normalization, and volume heard at the selected sink., Its state backs VDU audio status and command outcomes indirectly.]
    target_compatibility:
      status: portable-algorithms-fused-to-incompatible-output-class
      finding: The waveform arithmetic, attachment rules, and getSample mixer are portable C++, but getSample is private and the same class and headers embed classic-ESP32 physical members, register headers, initialization, and callbacks; retention requires a narrow PCM pull/sink seam and physical conditioning rather than excluding soundgen.cpp.
      evidence: [target:p4-audio-soc-caps]
    physical_owner_class: Extender
    physical_owner: Extender EDP synthesis runtime produces PCM for whichever Extender output sink is active
    author_review: {status: accepted, decision_date: 2026-08-22}
    disposition: retain
    rationale: These mature synthesis semantics directly implement accepted audio commands; a bounded adaptation exposing mixed PCM avoids rewriting waveforms and channel behavior while permitting a project-owned sink.
    omission_fallout: Omission leaves retained AudioChannel code without waveform classes, attachment services, volume control, or a mixer and would require rewriting the complete synthesis layer.
    dependencies: [W1E-Q03]
    dependency_effects:
      - {id: W1E-Q03, effect: blocks-implementation}
