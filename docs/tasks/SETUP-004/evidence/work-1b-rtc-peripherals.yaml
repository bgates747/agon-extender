records:
  - id: rtc-protocol-surface
    name: Stock VDP RTC command, packet, variables, and callbacks
    layer: VDP protocol and state
    scope: >-
      VDU 23,0,&87 read/set behavior, PACKET_RTC framing, RTC-backed VDP
      variables, and before/after packet callbacks; excludes the concrete clock
      provider and unresolved clock-authority policy.
    upstream_owner: agon-vdp
    source_highlights:
      - agon-vdp:video/agon.h
      - agon-vdp:video/vdu_sys.h
      - agon-vdp:video/vdp_variables.h
      - agon-vdp:video/vdu_stream_processor.h
    implementation_highlights:
      selected_translation_units:
        - agon-vdp:video/video.ino
      header_implementation:
        - agon-vdp:video/vdu_sys.h
        - agon-vdp:video/vdp_variables.h
        - agon-vdp:video/vdu_stream_processor.h
    facilities:
      - VDP_RTC command dispatch
      - PACKET_RTC response framing
      - RTC-related VDP variables
      - VDP protocol packet callbacks
    activation:
      - VDU 23,0,&87,0 reads the active time service and sends PACKET_RTC.
      - VDU 23,0,&87,1 parses date/time fields and sets the active time service.
      - VDP variable reads and writes access individual RTC fields.
    connections:
      startup: []
      tasks:
        - processLoop
      interrupts: []
      timers: []
      callbacks:
        - CALLBACK_SENDING_VDPP for PACKET_RTC
        - CALLBACK_SENT_VDPP for PACKET_RTC
      global_state:
        - rtc
    visible_behavior:
      - VDU 23,0,&87 preserves stock read and set command framing.
      - >-
        The stock RTC response is an eight-octet wire frame: packet header
        0x87, payload length 0x06, and six packed RTC payload octets.
      - >-
        MOS v3.0.2's UART0 VDP-protocol parser copies only the six payload
        octets into MOS-owned sysvars at offset 0x1A and sets completion-flag
        bit 5.
      - >-
        The adopted Extender harness terminates its P4 return path on eZ80
        UART1 at PC0/PC1. Stock MOS does not route that UART through its VDP
        packet parser, so an EDP-emitted RTC frame cannot update canonical MOS
        sysvars without an Extender-enabled MOS path.
      - Buffered VDP-protocol callbacks may inspect or alter RTC packet state.
      - RTC-related VDP variables expose and modify the same active clock.
    target_compatibility:
      status: provider-independent-contract
      finding: >-
        The command, packet, variable, and callback behavior is independent of
        a physical RTC device. The P4 can reproduce the stock wire frame, but
        stock MOS cannot consume it from the adopted UART1 return path;
        response routing, sysvar updates, and clock authority therefore depend
        on the selected operating mode and MOS integration.
      evidence:
        - target:idf-system-time
    physical_owner_class: shared
    physical_owner: MOS owns canonical sysvar storage; the onboard VDP or EDP may supply RTC response data only through the selected mode-specific route
    author_review:
      status: accepted
      decision_date: 2026-08-22
    disposition: retain
    rationale: >-
      The stock RTC command, six-byte payload, wire framing, variable, and
      callback semantics are normal application-visible VDP behavior and
      belong inside the EDP-exclusive backward-compatibility contract.
      Retention grants the EDP no ownership of MOS memory: legacy and stock-MOS
      cooperative operation leave canonical sysvars to the onboard VDP, while
      EDP-exclusive sysvar compatibility requires an explicit MOS-owned parser
      route. Clock authority and network synchronization remain separate.
    omission_fallout: >-
      Omission breaks VDU 23,0,&87, PACKET_RTC compatibility, RTC-backed VDP
      variables, and RTC packet callbacks. MOS RTC-sysvar compatibility is
      possible only where a selected route delivers the frame to MOS's parser.
    dependencies:
      - SETUP-005-D003
      - SETUP-005-D008
    dependency_effects:
      - id: SETUP-005-D003
        effect: blocks-implementation
      - id: SETUP-005-D008
        effect: blocks-implementation
    fallout_analysis:
      kind: retained-compatibility-contract
      first_failure: Removing dispatch or packet code breaks legacy RTC calls and response waiting.
      selected_consumers: mechanical.source_roles.inbound_consumers
      severance: Keep the protocol surface independent of the replaceable clock provider and mode-routing policy.
      residual_risk: Competing MOS, onboard-VDP, EDP, and network clock authorities remain unresolved.
    evidence_ids:
