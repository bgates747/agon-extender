  - id: rtc-esp32time-provider
    name: ESP32Time software-clock provider
    layer: Arduino/POSIX time service
    scope: >-
      The global ESP32Time object and its system-time-backed getters/setters;
      excludes the stock RTC protocol surface and future synchronization policy.
    upstream_owner: agon-vdp and ESP32Time
    source_highlights:
      - ESP32Time:ESP32Time.cpp
      - ESP32Time:ESP32Time.h
      - agon-vdp:video/video.ino
      - agon-vdp:video/vdu_sys.h
      - agon-vdp:video/vdp_variables.h
    implementation_highlights:
      selected_translation_units:
        - ESP32Time:ESP32Time.cpp
        - agon-vdp:video/video.ino
      header_implementation:
        - ESP32Time:ESP32Time.h
        - agon-vdp:video/vdu_sys.h
        - agon-vdp:video/vdp_variables.h
    facilities:
      - ESP32Time 2.0.6
      - POSIX settimeofday/gettimeofday and C time conversion
      - global rtc object
    activation:
      - The global rtc object is constructed during static initialization.
      - RTC commands and VDP variables call its field getters and setTime().
      - ESP32Time delegates storage to the ESP-IDF/Newlib system clock.
    connections:
      startup:
        - static construction of rtc
      tasks: []
      interrupts: []
      timers:
        - ESP-IDF system timekeeping
      callbacks: []
      global_state:
        - rtc
        - process-wide system clock
    visible_behavior:
      - Supplies every field returned by PACKET_RTC.
      - VDU and VDP-variable writes alter the process-wide system clock.
      - The provider is software timekeeping, not vdp-gl's DS3231 hardware driver.
      - Power-cycle persistence and automatic network synchronization are not supplied by this library alone.
    target_compatibility:
      status: source-compatible-runtime-unqualified
      finding: >-
        The pinned P4 build selects ESP32Time.cpp, and ESP-IDF 5.5.5 provides
        the Newlib system-time surface it uses. Runtime accuracy, reset
        persistence, timezone behavior, and network synchronization remain
        unqualified on the P4.
      evidence:
        - target:arduino-core
        - target:idf-system-time
    physical_owner_class: Extender
    physical_owner: Extender P4 system clock when the EDP owns RTC behavior
    author_review:
      status: accepted
      decision_date: 2026-08-22
    disposition: retain
    rationale: >-
      Retaining this thin, already-vendored provider minimizes divergence from
      upstream and uses normal P4 system-time facilities. A project-owned clock
      service may later wrap it to enforce authority and synchronization policy;
      replacement is unnecessary until a material limitation is evidenced.
    omission_fallout: >-
      Direct omission breaks the global rtc object and every RTC command and
      VDP-variable getter/setter unless a source-compatible provider replaces it.
    dependencies:
      - SETUP-004.1.g
      - SETUP-005-D008
    dependency_effects:
      - id: SETUP-004.1.g
        effect: requires-later-qualification
      - id: SETUP-005-D008
        effect: blocks-implementation
    fallout_analysis:
      kind: retained-provider
      first_failure: Removing ESP32Time first breaks compilation at rtc declaration and direct method calls.
      selected_consumers: mechanical.source_roles.inbound_consumers
      severance: Preserve the existing API behind any future project-owned authority/synchronization layer.
      residual_risk: Software-clock persistence, timezone semantics, and multi-authority synchronization remain unqualified.
    evidence_ids:
