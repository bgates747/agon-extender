    physical_owner_class: none
    physical_owner: No DS3231 device exists in the selected Extender v1 or stock Agon hardware baseline
    author_review:
      status: accepted
      decision_date: 2026-08-22
    disposition: omit
    rationale: >-
      The official RTC service uses ESP32Time, not this hardware driver. Exclude
      the unused translation unit from the Extender vdp-gl build while avoiding
      unnecessary edits to upstream umbrella declarations.
    omission_fallout: >-
      Source filtering removes no evidenced runtime behavior. DS3231 declarations
      may remain exposed by fabgl.h unless link closure or upstream build rules
      require a narrower header change.
