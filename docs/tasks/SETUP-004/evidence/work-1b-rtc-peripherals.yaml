      selected_consumers: mechanical.source_roles.inbound_consumers
      severance: Exclude DS3231.cpp through project-owned vdp-gl source selection and retain declarations unless qualification proves otherwise.
      residual_risk: Build/link closure and future upstream use must be rechecked on each tagged import.
