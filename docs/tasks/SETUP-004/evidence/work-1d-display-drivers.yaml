records:
  - id: display-vdp-screen-facade
    name: Official VDP screen, mode, palette, and controller integration facade
    layer: Header-defined official VDP integration
    scope: Global Canvas/controller ownership, mode selection and fallback, logical dimensions and scaling, palette operations, Copper signal-list forwarding, double buffering, plot completion, and frame-counter access.
    upstream_owner: agon-vdp
    source_highlights: [agon-vdp:video/agon_screen.h, agon-vdp:video/context.h, agon-vdp:video/vdu.h, agon-vdp:video/video.ino]
    implementation_highlights:
      selected_translation_units: [agon-vdp:video/video.ino]
      header_implementation: [agon-vdp:video/agon_screen.h, agon-vdp:video/context.h, agon-vdp:video/vdu.h]
    facilities: [global Canvas and controller lifetime, five stock color-depth modes, logical palette and Copper palette lists, framebuffer swap and completion waits, logical frame counter]
    activation: [Startup selects the initial mode., VDU 22 and mode-changing extensions replace the active controller and Canvas., Drawing, palette, Copper, sprite, read-pixel, and frame-wait commands use the globals continuously.]
    connections: {startup: [setup and initial mode selection], tasks: [processLoop and retained display worker], interrupts: [upstream VGA VSync ISR through frameCounter], timers: [], callbacks: [CALLBACK_MODE_CHANGE, CALLBACK_PALETTE, CALLBACK_VSYNC], global_state: [_VGAController, canvas, canvasW, canvasH, palette, videoMode, logicalScaleX, logicalScaleY]}
    visible_behavior: [All accepted screen, text, graphics, bitmap, sprite, palette, Copper, tile, context, plot, screen-read, mode-information, buffering, and VSYNC behaviors pass through this facade., VDU 22 failure falls back to the prior mode and then mode 1., Frame progression drives waits, cursor state, and buffered VSYNC callbacks.]
    target_compatibility:
      status: source-shape-retainable-controller-binding-requires-adaptation
      finding: The header-defined facade is architecture-neutral except for its concrete VGABaseController types and assumptions; P4 output requires a retained facade over an Extender-compatible controller implementation.
      evidence: [target:p4-display-soc-caps, target:p4-mipi-dsi]
    physical_owner_class: Extender
    physical_owner: Extender EDP owns the facade and selected display state in EDP-active modes
    author_review: {status: accepted, decision_date: 2026-08-22}
    disposition: retain
    rationale: The accepted VDU inventory requires its complete logical surface, while preserving upstream names and placement minimizes future tagged-release merge work.
    omission_fallout: Omission removes the central display state used throughout the effective video.ino translation unit; retention still requires a narrow controller-construction adaptation.
    dependencies: [W1D-Q02, W1D-Q03, SETUP-005-D002]
    dependency_effects:
      - {id: W1D-Q02, effect: blocks-implementation}
      - {id: W1D-Q03, effect: blocks-implementation}
      - {id: SETUP-005-D002, effect: requires-later-qualification}
    evidence_ids: [evidence:reviewed:facility-graphics-display-0]
    graph_node_ids: [subsystem:agon-vdp:graphics-display, file:agon-vdp:video/agon_screen.h]
    agent_entry_points: [agon-vdp:video/agon_screen.h:1, agon-vdp:video/vdu.h:299, agon-vdp:video/context.h:1312]

  - id: display-canvas-common-rendering
    name: FabGL Canvas and common bitmapped rendering semantics
    layer: vdp-gl portable drawing command and state layer
    scope: Canvas command generation plus common primitive queues, paint state, clipping, geometry, glyph, bitmap transform, sprite, cursor, readback, and double-buffer contracts; excludes concrete pixel storage and output scanout.
    upstream_owner: vdp-gl
    source_highlights: [vdp-gl:src/canvas.cpp, vdp-gl:src/canvas.h, vdp-gl:src/displaycontroller.cpp, vdp-gl:src/displaycontroller.h]
    implementation_highlights:
      selected_translation_units: [vdp-gl:src/canvas.cpp, vdp-gl:src/displaycontroller.cpp]
      header_implementation: [vdp-gl:src/canvas.h, vdp-gl:src/displaycontroller.h]
    facilities: [Canvas API, FreeRTOS primitive queue, paint and clipping state, generic geometry and bitmap algorithms, software sprite and cursor composition, abstract BitmappedDisplayController contract]
    activation: [changeResolution constructs Canvas over the active controller., Nearly every retained text and graphics command queues or executes Canvas primitives., The concrete backend drains primitives and reports updates.]
    connections: {startup: [Canvas construction after mode selection], tasks: [upstream primitive task or replacement display worker], interrupts: [upstream may execute primitives in VSync ISR], timers: [], callbacks: [], global_state: [controller paint state, primitive queue, sprites, mouse cursor, text cursor]}
    visible_behavior: [Defines ordering and results for retained text, plot, path, font, bitmap, sprite, cursor, transform, scroll, readback, flush, and buffer-swap operations., Queue completion and refresh timing are observable through waits and VSYNC-dependent commands.]
    target_compatibility:
      status: mostly-portable-with-one-architecture-specific-isr-path
      finding: Canvas and most common controller code use portable C++ and retained FreeRTOS APIs, but transformed-bitmap execution inside an ISR directly saves Xtensa coprocessor state with xthal calls and cannot be retained unchanged on the RISC-V P4.
      evidence: [target:p4-display-soc-caps]
    physical_owner_class: Extender
    physical_owner: Extender EDP rendering runtime and framebuffer state
    author_review: {status: accepted, decision_date: 2026-08-22}
    disposition: retain
    rationale: This is the closest existing semantic seam beneath official VDP commands and preserves mature drawing behavior without rewriting the parser or graphics model.
    omission_fallout: Omission forces a complete rewrite of the accepted drawing surface; retention requires removing or replacing only architecture-specific ISR execution assumptions and connecting a new concrete backend.
    dependencies: [W1D-Q03]
    dependency_effects:
      - {id: W1D-Q03, effect: blocks-implementation}
    evidence_ids: [evidence:reviewed:facility-graphics-display-0]
    graph_node_ids: [file:vdp-gl:src/canvas.cpp, file:vdp-gl:src/canvas.h, file:vdp-gl:src/displaycontroller.cpp, file:vdp-gl:src/displaycontroller.h]
    agent_entry_points: [vdp-gl:src/canvas.h:70, vdp-gl:src/displaycontroller.h:897, vdp-gl:src/displaycontroller.cpp:792]

  - id: display-vga-concrete-controller-family
    name: FabGL concrete VGA framebuffer renderers and ESP32 scanout engine
    layer: vdp-gl concrete framebuffer and physical output implementation
    scope: VGA2/4/8/16/64 pixel formats and drawing methods, palettes and Copper signal lists, scanline sprite composition, modelines, framebuffer allocation, frame counter, primitive scheduling, GPIO matrix, I2S1 DMA, and VSync ISRs.
    upstream_owner: vdp-gl
    source_highlights: [vdp-gl:src/dispdrivers/vgabasecontroller.cpp, vdp-gl:src/dispdrivers/vgapalettedcontroller.cpp, vdp-gl:src/dispdrivers/vga2controller.cpp, vdp-gl:src/dispdrivers/vga4controller.cpp, vdp-gl:src/dispdrivers/vga8controller.cpp, vdp-gl:src/dispdrivers/vga16controller.cpp, vdp-gl:src/dispdrivers/vga64controller.cpp]
    implementation_highlights:
      selected_translation_units: [vdp-gl:src/dispdrivers/vgabasecontroller.cpp, vdp-gl:src/dispdrivers/vgacontroller.cpp, vdp-gl:src/dispdrivers/vgapalettedcontroller.cpp, vdp-gl:src/dispdrivers/vga2controller.cpp, vdp-gl:src/dispdrivers/vga4controller.cpp, vdp-gl:src/dispdrivers/vga8controller.cpp, vdp-gl:src/dispdrivers/vga16controller.cpp, vdp-gl:src/dispdrivers/vga64controller.cpp]
      header_implementation: [vdp-gl:src/dispdrivers/vgabasecontroller.h, vdp-gl:src/dispdrivers/vgapalettedcontroller.h, vdp-gl:src/dispdrivers/vga2controller.h, vdp-gl:src/dispdrivers/vga4controller.h, vdp-gl:src/dispdrivers/vga8controller.h, vdp-gl:src/dispdrivers/vga16controller.h, vdp-gl:src/dispdrivers/vga64controller.h]
    facilities: [packed legacy framebuffer formats, RGB222 and indexed palettes, Copper scanline palette changes, software and scanline sprite composition, Linux-style modelines, I2S1 parallel output, legacy DMA descriptor chains, GPIO matrix, VSync ISR and frame counter]
    activation: [getVGAController constructs one concrete class on every startup or mode change., begin and setResolution configure GPIO, I2S1, DMA, framebuffer, worker, and ISR state., Every retained drawing command ultimately calls the selected controller.]
    connections: {startup: [updateVGAController and changeResolution], tasks: [primitiveExecTask], interrupts: [I2S1 VSync and scanline ISRs], timers: [], callbacks: [frameCounter observed by CALLBACK_VSYNC processing], global_state: [_VGAController, framebuffer rows, visible and drawing buffers, palettes, signal lists, DMA chains]}
    visible_behavior: [Provides exact stock pixel formats, palette quantization, screen dimensions, readback, sprites, Copper scanline effects, double buffering, frame timing, and all rendered output., Mode and memory failures are visible to VDU 22 fallback behavior.]
    target_compatibility:
      status: physical-engine-incompatible-behavioral-reference-required
      finding: The implementation is inseparably specialized for classic ESP32 GPIO-matrix plus I2S1 VGA scanout and legacy DMA/ISR behavior; P4 instead exposes native LCD, RGB, and MIPI-DSI facilities, while Extender's guaranteed initial sink is network/browser video.
      evidence: [target:p4-display-soc-caps, target:p4-interrupt-sources, target:p4-mipi-dsi, target:p4-rgb-panel]
    physical_owner_class: Extender
    physical_owner: Extender EDP owns replacement framebuffer production and output sinks; the onboard VDP retains its original VGA hardware in legacy mode
    author_review: {status: accepted, decision_date: 2026-08-22}
    disposition: replace
    rationale: Preserve the class-facing and application-visible behavior as closely as practical, reuse proven algorithms where separable, and replace the ESP32 VGA physical engine with an Extender-owned framebuffer/frame-clock backend that can feed network and later local-display sinks.
    omission_fallout: Direct omission breaks agon_screen.h construction, palette casts, Canvas, every drawing command, frame waits, and callbacks; replacement must satisfy those seams before source filtering the old concrete translation units.
    dependencies: [SETUP-005-D002]
    dependency_effects:
      - {id: SETUP-005-D002, effect: requires-later-qualification}
    fallout_analysis: {kind: replace-fused-display-backend, first_failure: agon_screen.h cannot construct or type the active controller after the old classes are excluded., selected_consumers: mechanical.source_roles.inbound_consumers, severance: Introduce an Extender-compatible BitmappedDisplayController implementation and narrow construction/type adaptations while preserving logical mode and frame contracts., residual_risk: Pixel-level fidelity, Copper timing, sprite composition, frame pacing, memory limits, and sink synchronization require implementation and qualified comparison.}
    evidence_ids: [evidence:reviewed:facility-graphics-display-1, evidence:reviewed:facility-graphics-display-2, evidence:reviewed:facility-graphics-display-3, evidence:reviewed:facility-graphics-display-4]
    graph_node_ids: [file:vdp-gl:src/dispdrivers/vgabasecontroller.cpp, file:vdp-gl:src/dispdrivers/vgapalettedcontroller.cpp, physical-facility:reviewed:esp32%20gpio%20matrix, physical-facility:reviewed:i2s1%20register%20block%20and%20interrupt%20source]
    agent_entry_points: [agon-vdp:video/agon_screen.h:38, vdp-gl:src/dispdrivers/vgabasecontroller.h:118, vdp-gl:src/dispdrivers/vgapalettedcontroller.h:67, vdp-gl:src/dispdrivers/vga8controller.cpp:701]

  - id: display-vga-text-controller
    name: Unused FabGL hardware VGA text controller
    layer: Independently compiled vdp-gl physical display driver
    scope: FabGL character-cell VGA controller; distinct from official VDP text rendering, which uses Canvas on a bitmapped controller.
    upstream_owner: vdp-gl
    source_highlights: [vdp-gl:src/dispdrivers/vgatextcontroller.cpp, vdp-gl:src/dispdrivers/vgatextcontroller.h, vdp-gl:src/fabgl.h]
    implementation_highlights:
