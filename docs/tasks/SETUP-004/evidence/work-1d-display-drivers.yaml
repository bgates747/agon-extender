    physical_owner_class: none
    physical_owner: No Extender v1 behavior selects this independent hardware text controller
    author_review: {status: accepted, decision_date: 2026-08-22}
    disposition: omit
    rationale: Official VDP text is already rendered through retained Canvas/bitmapped behavior, so porting a second unused physical VGA implementation would add risk without compatibility value.
