      header_implementation: [vdp-gl:src/dispdrivers/vgatextcontroller.h]
    facilities: [character map, hardware text cursor, ESP32 GPIO/I2S1/DMA VGA scanout, scanline ISR]
    activation: [The broad vdp-gl library build selects the translation unit., No official VDP construction or runtime reference was found.]
    connections: {startup: [], tasks: [], interrupts: [dormant unless constructed], timers: [], callbacks: [], global_state: []}
    visible_behavior: [No official VDP v2.16.0 command, response, status packet, or display behavior reaches this controller.]
    target_compatibility:
      status: architecture-specific-and-runtime-unused
      finding: The driver uses the same classic ESP32 I2S1/GPIO VGA architecture as the replaced bitmapped family and supplies no selected official VDP behavior.
