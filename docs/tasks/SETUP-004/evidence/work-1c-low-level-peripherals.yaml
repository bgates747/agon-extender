    name: Stock VDP UART hardware binding and flow-control configuration
    layer: Transport hardware
    scope: Stock Serial2 binding, 1.152-Mbaud setup, pins, flow control, buffering, and timeouts; excludes the retained Stream parser contract.
    upstream_owner: agon-vdp and vdp-gl
    source_highlights: [agon-vdp:video/vdp_protocol.h, agon-vdp:video/agon.h, agon-vdp:video/video.ino, vdp-gl:src/terminal.cpp]
    implementation_highlights:
      selected_translation_units: [agon-vdp:video/video.ino, vdp-gl:src/terminal.cpp]
      header_implementation: [agon-vdp:video/vdp_protocol.h, agon-vdp:video/agon.h]
    facilities: [Arduino HardwareSerial, stock UART2 pins, RTS/CTS flow control, receive buffering and timeouts]
    activation: [setupVDPProtocol initializes Serial2 during VDP startup; terminal mode can rebind the serial path.]
    connections: {startup: [setupVDPProtocol], tasks: [processLoop], interrupts: [], timers: [], callbacks: [], global_state: [VDPSerial]}
    visible_behavior: [Carries the complete stock VDU byte stream and framed VDP responses at 1,152,000 baud., Flow control and timeout behavior affect parser pacing and legacy compatibility.]
    target_compatibility:
      status: portable-api-incompatible-binding
      finding: Arduino HardwareSerial exists on P4, but stock pins, one-duplex-stream ownership, and terminal/maintenance coupling do not match the adopted Extender transport.
      evidence: [target:hardware-serial, target:p4-soc-caps]
    physical_owner_class: shared
    physical_owner: Agon main board and Extender P4 across the adopted parallel-forward and UART1-return harness
    author_review: {status: accepted, decision_date: 2026-08-22}
    disposition: replace
    rationale: Prior Work 1.a and harness decisions require Stream-compatible Extender transport adapters while preserving the stock wire contract where strict mode requires it.
    omission_fallout: Omission removes all command input and return packets; direct retention conflicts with Extender wiring and mode ownership.
    dependencies: [SETUP-004.1.g, SETUP-005-D001, SETUP-005-D003]
    dependency_effects:
