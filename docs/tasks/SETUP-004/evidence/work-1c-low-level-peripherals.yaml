      - {id: SETUP-005-D001, effect: blocks-implementation}
      - {id: SETUP-005-D003, effect: blocks-implementation}
    fallout_analysis: {kind: replace-hardware-binding, first_failure: Removing VDPSerial without an adapter breaks setup and parser construction., selected_consumers: mechanical.source_roles.inbound_consumers, severance: Preserve Stream-facing calls behind separate Extender forward and return transports., residual_risk: Target-speed flow control and mode routing remain unqualified.}
