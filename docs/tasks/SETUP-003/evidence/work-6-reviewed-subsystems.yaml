subsystems:
  - id: startup-orchestration
    runtime_status: unconditional-startup
    owns:
      - Arduino setup/loop lifecycle
      - primary VDU processing task
      - startup ordering for display, transport, input, and audio
    activation:
      - setup initializes display, font, UART protocol, stream processor,
        processLoop task, and audio in a fixed sequence.
      - processLoop initializes PS/2 input, waits for the eZ80 handshake, then
        alternates terminal processing with VDU stream processing forever.
      - Arduino loop is intentionally idle after setup.
    owning_state:
      - Core0Task
      - processor
      - Terminal
      - terminalState
      - consoleMode
    direct_facilities:
      - Arduino lifecycle and delay
      - FreeRTOS pinned tasks
      - ESP32 per-core watchdog controls
    compile_conditions:
      - VDP_USE_WDT changes watchdog behavior but not subsystem selection.
      - USERSPACE changes emulator/debug behavior but is not a production
        feature switch for display, input, transport, or audio.
    visible_dependencies:
      - All normal VDU command handling depends on processLoop and processor.
      - Keyboard/mouse initialization and audio initialization are not guarded
        by independent production feature switches.
    portability_boundary: >-
      The top-level lifecycle is a reusable orchestration concept, but its
      startup sequence directly names ESP32 watchdog APIs, pinned FreeRTOS
      tasks, physical PS/2 setup, FabGL display setup, and FabGL audio setup.
    omission_assessment:
      cleanly_omittable_from_evidence: false
      fallout: Removing this path removes normal VDU command processing.
      required_boundary: Platform startup and subsystem lifecycle orchestration.
    evidence:
      - owner: agon-vdp
        path: video/video.ino
        line: 99
        fact: setup is the firmware startup entry point.
