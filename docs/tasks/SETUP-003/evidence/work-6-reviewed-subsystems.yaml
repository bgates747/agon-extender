    activation:
      - setupVDPProtocol configures Serial2 at startup.
      - VDUStreamProcessor is constructed over Serial2 as both input and
        initial output stream.
      - wait_eZ80 performs the initial command synchronization before normal
        processNext dispatch.
    owning_state:
      - VDPSerial macro bound to Serial2
      - VDUStreamProcessor inputStream
      - VDUStreamProcessor outputStream
      - VDUStreamProcessor originalOutputStream
    direct_facilities:
      - Arduino HardwareSerial and Stream
      - UART2 pins, RTS/CTS flow control, receive buffer, and timeouts
    compile_conditions: []
    visible_dependencies:
      - VDU commands arrive on this stream.
      - MOS packets, keyboard/mouse events, audio acknowledgements, mode data,
        RTC data, and transfer control bytes return on the same stream.
    portability_boundary: >-
      VDUStreamProcessor accepts the abstract Arduino Stream interface, but
      the official runtime binds it to HardwareSerial Serial2 and shares that
      same duplex stream for command input and protocol packet output.
    omission_assessment:
      cleanly_omittable_from_evidence: false
      fallout: Removing it removes the stock MOS/VDP command and return channel.
      required_boundary: Duplex Stream-compatible VDP transport.
