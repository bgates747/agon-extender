  - id: dependency-source-selection
    runtime_status: build-time-selection-with-mixed-runtime-reachability
    owns:
      - FabGL translation-unit inclusion in the PlatformIO library build
      - umbrella-header declaration exposure
    activation:
      - Work 4 compile evidence records 31 vdp-gl translation units selected
        for compilation.
      - Official VDP includes fabgl.h, whose umbrella surface includes display,
        terminal, PS/2, TSI2C, keyboard, mouse, DS3231, scene, collision, and
        sound declarations.
      - Runtime construction or calls—not compilation alone—activate hardware,
        tasks, callbacks, or interrupts.
    owning_state: []
    direct_facilities:
      - PlatformIO library source selection
      - vdp-gl umbrella headers
    compile_conditions:
      - Library source selection is broader than the official VDP runtime call surface.
    visible_dependencies:
      - Active official paths directly use VGA, Canvas, Terminal, PS/2,
        Keyboard, Mouse, and SoundGenerator.
      - Exact official-source searches find no direct CVBSGenerator, ICMP,
        DS3231, MCP23S17, or TSI2C reference.
      - WiFi appears only as an include in video.ino; official v2.16.0 contains
        no WiFi API use.
    portability_boundary: >-
      Build inclusion, header coupling, and runtime ownership are three
      separate facts. A compiled dependency translation unit can fail on P4
      without being part of the official runtime, while a shared header can
      still block preprocessing even when its particular driver is unused.
      The missing soc/frc_timer_reg.h is on FabGL's broad fabutils.h path and
      therefore cannot be dismissed solely as an unused-driver failure.
    omission_assessment:
      cleanly_omittable_from_evidence: not-established
      fallout: >-
        Five translation units lack direct official VDP references, but source
        filtering and link/header closure have not yet been qualified.
      required_boundary: Build source selection must be reviewed separately from runtime interfaces.
