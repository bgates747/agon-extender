  - id: runtime-concurrency
    runtime_status: cross-cutting
    owns:
      - task, timer, queue, mutex, callback, and interrupt relationships across
        active runtime subsystems
    activation:
      - Official startup creates processLoop and audioDriver.
      - VGA initialization creates a primitive task and I2S1 interrupt.
      - PS/2 initialization activates ULP/RTC interrupt and keyboard/mouse tasks.
      - Terminal activation creates timer, queue, consumer task, and serial
        keyboard-reader task.
    owning_state:
      - Core0Task
      - audioTask
      - VGA primitive task and interrupt handle
      - PS2Controller/Keyboard/Mouse task, queue, and interrupt state
      - Terminal timer, queue, mutex, and task handles
    direct_facilities:
      - FreeRTOS tasks, queues, semaphores, and timers
      - ESP32 interrupt allocation and core affinity
      - I2S0, I2S1, RTC/ULP, and UART interrupt sources
    compile_conditions:
      - Some compiled-only vdp-gl units define additional tasks or interrupts,
        but they are not active unless their owning object is constructed.
    visible_dependencies:
      - Responsiveness and ordering of VDU processing, drawing, input, audio,
        and terminal mode
    portability_boundary: >-
      Port planning must preserve lifecycle and synchronization behavior for
      retained protocol semantics, while separately reviewing each physical
      interrupt source and core-affinity assumption. Static task-creation text
      in an uninstantiated driver does not prove runtime activity.
    omission_assessment:
      cleanly_omittable_from_evidence: false
      fallout: Concurrency resources follow active subsystem ownership and cannot be removed as one unit.
      required_boundary: Per-subsystem lifecycle, synchronization, interrupt, and core-affinity contracts.
