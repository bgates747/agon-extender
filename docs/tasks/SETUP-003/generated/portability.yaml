  - id: physical-ps2-input
    runtime_status: unconditional-initialization-continuous-polling
    owns:
    - physical PS/2 keyboard and mouse ports
    - keyboard layout, code page, typematic settings, and LED state
    - mouse availability, motion settings, absolute position, and cursor state
    activation:
    - processLoop calls setupKeyboardAndMouse before command processing.
    - setupKeyboardAndMouse starts FabGL PS2Controller and configures keyboard and mouse
      state.
    - every processNext invocation polls keyboard and mouse and emits events.
    owning_state:
    - FabGL PS2Controller singleton
    - keyboard and mouse device objects
    - keyboard/mouse globals in agon_ps2.h
    - VDUStreamProcessor eventQueue and VDP input variables
    direct_facilities:
    - FabGL PS2Controller, Keyboard, Mouse, layouts, and Cursor
    - ESP32 ULP, RTC GPIO, SENS registers, RTC interrupt, queues, and tasks
    - active VGA controller for mouse positioning and cursor rendering
    compile_conditions:
    - USERSPACE stubs ZDI calls but does not remove the keyboard/mouse API.
    - No official production switch excludes physical PS/2 initialization.
    visible_dependencies:
    - VDP_KEYCODE, VDP_KEYSTATE, and VDP_MOUSE command behavior
    - PACKET_KEYCODE and PACKET_MOUSE events
    - keyboard and mouse VDP variables and callbacks
    - paged-mode and Ctrl/Shift pause/resume behavior
    - terminal emergency-exit key and console/ZDI entry path
    - mouse cursor graphics
    portability_boundary: Physical PS/2 acquisition is separable in concept from protocol-visible
      keyboard/mouse semantics, but the official main loop, pause logic, terminal mode,
      debug paths, VDP variables, and VGA cursor code all call FabGL input objects directly.
    omission_assessment:
      cleanly_omittable_from_evidence: false
      fallout: Direct omission breaks callers outside the physical driver and changes
        commands, packets, variables, pause behavior, and maintenance paths.
