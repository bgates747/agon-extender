  - id: graphics-display
    runtime_status: unconditional-startup-and-command-driven
    owns:
    - VGA controller selection and lifetime
    - video mode and resolution
    - framebuffer, palette, canvas, sprites, cursors, and drawing queue
    activation:
    - setup calls changeMode before creating the command processor.
    - updateVGAController ends the previous controller and begins a selected FabGL VGA
      controller.
    - changeResolution allocates the canvas and starts background primitive execution.
    - VDU text, graphics, mode, sprite, bitmap, cursor, and buffer commands operate
      through the active Context, Canvas, and VGA controller.
    owning_state:
    - canvas
    - _VGAController
    - _VGAColourDepth
    - palette
    - canvasW and canvasH
    - videoMode
    - Context and contextStacks
    direct_facilities:
    - FabGL Canvas and VGA2/VGA4/VGA8/VGA16/VGA64 controllers
    - ESP32 GPIO matrix
    - I2S1 register block and interrupt source
    - DMA descriptors and capability-specific heap allocation
    - FreeRTOS primitive execution task
    compile_conditions:
    - No official production switch excludes graphics initialization.
    visible_dependencies:
    - Normal text and graphics output
    - mode selection and PACKET_MODE dimensions
    - pixel/character reads, palettes, sprites, cursors, and double buffering
    - mouse cursor rendering and updater sprite/cursor suppression
    portability_boundary: The VDU graphics state machine and externally visible commands
      are conceptually distinct from scanout, but official source directly stores FabGL
      VGA/Canvas types and vdp-gl implements active VGA controllers with ESP32 I2S1,
      GPIO, DMA, interrupts, and pinned tasks.
    omission_assessment:
