reviewed_subsystems:
  - id: startup-orchestration
    runtime_status: unconditional-startup
    owns:
    - Arduino setup/loop lifecycle
    - primary VDU processing task
    - startup ordering for display, transport, input, and audio
    activation:
    - setup initializes display, font, UART protocol, stream processor, processLoop
      task, and audio in a fixed sequence.
    - processLoop initializes PS/2 input, waits for the eZ80 handshake, then alternates
      terminal processing with VDU stream processing forever.
    - Arduino loop is intentionally idle after setup.
    owning_state:
    - Core0Task
    - processor
    - Terminal
    - terminalState
    - consoleMode
    direct_facilities:
    - Arduino lifecycle and delay
    - FreeRTOS pinned tasks
    - ESP32 per-core watchdog controls
    compile_conditions:
    - VDP_USE_WDT changes watchdog behavior but not subsystem selection.
    - USERSPACE changes emulator/debug behavior but is not a production feature switch
      for display, input, transport, or audio.
    visible_dependencies:
    - All normal VDU command handling depends on processLoop and processor.
    - Keyboard/mouse initialization and audio initialization are not guarded by independent
      production feature switches.
    portability_boundary: The top-level lifecycle is a reusable orchestration concept,
      but its startup sequence directly names ESP32 watchdog APIs, pinned FreeRTOS tasks,
      physical PS/2 setup, FabGL display setup, and FabGL audio setup.
    omission_assessment:
      cleanly_omittable_from_evidence: false
      fallout: Removing this path removes normal VDU command processing.
      required_boundary: Platform startup and subsystem lifecycle orchestration.
    evidence:
    - owner: agon-vdp
      path: video/video.ino
      line: 99
      fact: setup is the firmware startup entry point.
    - owner: agon-vdp
      path: video/video.ino
      line: 105
      fact: Display mode creation occurs before transport and task startup.
    - owner: agon-vdp
      path: video/video.ino
      line: 107
      fact: setup initializes the VDP protocol transport.
    - owner: agon-vdp
      path: video/video.ino
      line: 109
      fact: setup creates processLoop pinned to core 0.
    - owner: agon-vdp
      path: video/video.ino
      line: 118
      fact: setup initializes audio unconditionally.
    - owner: agon-vdp
      path: video/video.ino
      line: 125
      fact: Arduino loop performs no firmware work beyond sleeping.
    - owner: agon-vdp
      path: video/video.ino
      line: 136
      fact: processLoop initializes keyboard and mouse before its main loop.
    - owner: agon-vdp
      path: video/video.ino
      line: 154
      fact: processLoop repeatedly invokes processNext.
  - id: primary-vdp-transport
    runtime_status: unconditional-startup
    owns:
    - eZ80-to-VDP command byte stream
    - VDP-to-MOS packet return path
    - UART flow control and buffering
    activation:
    - setupVDPProtocol configures Serial2 at startup.
    - VDUStreamProcessor is constructed over Serial2 as both input and initial output
      stream.
    - wait_eZ80 performs the initial command synchronization before normal processNext
      dispatch.
    owning_state:
    - VDPSerial macro bound to Serial2
    - VDUStreamProcessor inputStream
    - VDUStreamProcessor outputStream
    - VDUStreamProcessor originalOutputStream
    direct_facilities:
    - Arduino HardwareSerial and Stream
    - UART2 pins, RTS/CTS flow control, receive buffer, and timeouts
    compile_conditions: []
    visible_dependencies:
    - VDU commands arrive on this stream.
    - MOS packets, keyboard/mouse events, audio acknowledgements, mode data, RTC data,
      and transfer control bytes return on the same stream.
    portability_boundary: VDUStreamProcessor accepts the abstract Arduino Stream interface,
      but the official runtime binds it to HardwareSerial Serial2 and shares that same
      duplex stream for command input and protocol packet output.
    omission_assessment:
      cleanly_omittable_from_evidence: false
      fallout: Removing it removes the stock MOS/VDP command and return channel.
      required_boundary: Duplex Stream-compatible VDP transport.
