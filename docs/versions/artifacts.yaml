  - artifact_id: extender-vdp
    kind: firmware
    identity_scheme: semantic_version
    latest_identity: extender-vdp-v0.2.0
    status: rejected
    variants:
      - olimex-p4-devkit
    description: Production Extender VDP firmware lineage.
    notes:
      - Version v0.1.0 freezes the first bootable retained-VDP P4 browser-video target for P4-only qualification.
      - Version v0.1.0 was rejected by PORT-003-2026-08-28-14-46-06Z after its retained watchdog calls left ESP-IDF IDLE hooks feeding unregistered tasks.
      - Version v0.1.1 preserves the retained no-IDLE-watchdog intent through ESP-IDF's hook-aware reconfiguration path.
      - Version v0.1.1 passed p4-browser-video-qualification-r01 in PORT-003-2026-08-28-15-28-59Z.
      - Its qualified scope has deliberately disconnected VDU ingress and return transport and makes no Agon integration claim.
      - Version v0.2.0 adds the bounded light2-harness-r01 forward-parallel ingress while retaining browser video and discard-only return behavior.
      - Version v0.2.0 was rejected and superseded on 2026-09-01; its boot-active forward adapter and discard-success return path are predecessor evidence only and must not be selected.
      - Production-integration source is frozen in Extender commit e134f3d, but no approved artifact identity or post-freeze qualified build exists and it is not represented here as a deployable candidate.

