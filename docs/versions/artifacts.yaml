      - Version v0.1.0 freezes the rejected PORT-008 predecessor in the separate agon-emos repository.
      - The former port008-forward build profile is a fail-fast tombstone; its fixed-purpose sender, precommit General Poll, and predecessor lifecycle must not be selected.
