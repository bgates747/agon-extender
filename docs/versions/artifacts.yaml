  - artifact_id: light2-harness
    kind: wiring_harness
    identity_scheme: revision
    latest_identity: light2-harness-r03
    status: draft
    variants:
      - light2
    description: Extender wiring harness for Agon Light 2 GPIO.
    notes:
      - Revision r01 adopts the physically exercised predecessor breadboard pin map as the authoritative first design target.
      - Its forward mapping has inherited qualification evidence; the clean-project combination remains a candidate.
      - The earlier buffered PC0/PC1 UART target has predecessor correctness evidence at 115.2 kbaud; it is not the current simplified-wiring review target.
      - Operation at the required 1.152 Mbaud legacy rate, required flow-control behavior, production isolation, power behavior, and final carrier construction remain unqualified.
      - Revision r02 freezes the four-chip common-UART and forward-parallel controlled-prototype circuit with 220-ohm series population on all thirteen driven outputs.
      - Revision r02 is an unqualified candidate; eZ80-only reset recovery, Legacy electrical absence, target-rate UART and flow control, transport epochs, and physical qualification remain open.
      - Revision r02 design, construction and testing are on hold with full wiring incomplete and the complete circuit untested.
      - Revision r03 is the Author-requested draft of direct Port C wiring with eight 220-ohm series resistors and eight 15k Agon-rail pull-ups for initial Exclusive Compatible review under HW-002.
      - Revision r03 is not an accepted replacement design or verified as-built record; its new identity does not reclassify an assembly or inherit predecessor qualification.

