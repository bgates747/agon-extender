  - artifact_id: port-003-frame-service-canary
    kind: experimental_firmware
    identity_scheme: revision
    latest_identity: port-003-frame-service-canary-r02
    status: qualified
    variants:
      - olimex-p4-devkit
    description: Sink-free PORT-003 logical frame-service qualification firmware.
    notes:
      - Revision r01 was rejected after corrective review found project-authored queue-completion, swap-notification, cancellation, and tick-coalescing behavior outside the faithful-port directive.
      - Revision r02 restores pinned upstream queue, completion-wait, swap-notification, background-lifecycle, and payload behavior while retaining the necessary P4 logical frame executor.
      - Revision r02 exercises cadence, rollover, one-edge-per-recorded-tick backlog handling, bounded unconsumed-consumer drops, lifecycle restart, and heap stability without a physical output sink.
      - Revision r02 passed p4-frame-service-qualification-r03 in PORT-003-2026-08-22-23-58-56Z.

