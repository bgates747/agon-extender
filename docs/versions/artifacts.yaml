    description: Project-owned backward-compatible MOS build with EMOS services and mode authority.
    notes:
      - Author approved v0.1.8 and registry r35 for INTEG-009 resident keyboard reception, then accepted the Work 2 emulator result and source freeze on 2026-09-08. The reviewed build remains draft; this checkpoint does not authorize deployment or claim P4/browser keyboard qualification.
