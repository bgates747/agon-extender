  - artifact_id: extender-vdp
    kind: firmware
    identity_scheme: semantic_version
    latest_identity: null
    status: draft
    variants:
      - olimex-p4-devkit
    description: Production Extender VDP firmware lineage.

  - artifact_id: setup-001-canary
    kind: experimental_firmware
    identity_scheme: revision
    latest_identity: setup-001-canary-r03
    status: qualified
    variants:
      - olimex-p4-devkit
    description: GPIO-inert hybrid-framework and board bring-up canary.
    notes:
      - Revision r01 was rejected after physical qualification reported 360 MHz instead of 400 MHz.
      - Revision r01 also sent Arduino Serial output to UART0 rather than USB Serial/JTAG.
      - Revision r02 explicitly selects the pre-v3 400 MHz exception and reports through ESP-IDF logging.
      - Revision r02 was rejected by SETUP-001-2026-08-20-22-18-02Z after the forced 400 MHz clock initialization asserted on every boot.
      - Revision r03 retains USB Serial/JTAG logging but explicitly returns rev 1.3 silicon to 360 MHz.
      - Revision r03 passed initial boot plus three repeat resets in SETUP-001-2026-08-20-22-31-26Z.

  - artifact_id: olimex-p4-devkit-profile
    kind: board_profile
    identity_scheme: revision
    latest_identity: olimex-p4-devkit-profile-r03
    status: qualified
    variants:
      - rev-d1-pre-v3
    description: PlatformIO and ESP-IDF profile for the current Olimex development board.
    notes:
      - Revision r01 did not propagate its 400 MHz board declaration into ESP-IDF Kconfig.
      - Revision r02 explicitly enables ESP-IDF's pre-v3 400 MHz qualification gate.
      - Revision r02 was rejected on this rev 1.3 board; revision r03 removes the unsafe gate and explicitly selects 360 MHz.
      - Revision r03 physically qualified QIO 80 MHz, 16 MiB flash, 360 MHz CPU, and 32 MiB hexadecimal PSRAM at 200 MHz.

  - artifact_id: p4-ota-partition-layout
    kind: flash_layout
    identity_scheme: revision
    latest_identity: p4-ota-partition-layout-r01
