    variants: []
    description: Dual 7 MiB OTA layout with rollback, core dumps, and reserved capacity.

  - artifact_id: p4-bringup-procedure
    kind: test_procedure
    identity_scheme: revision
    latest_identity: p4-bringup-procedure-r03
    status: qualified
    variants: []
    description: Identity-check, flash, capture, verify, reset-stability, and recovery procedure for P4 qualification.
    notes:
      - Revision r02 deliberately omits flash backup because the prior firmware is reproducible from the legacy project.
      - Revision r03 changes the required CPU observation to the proven-safe 360 MHz setting.
      - Revision r03 passed all four boot captures in SETUP-001-2026-08-20-22-31-26Z.

  - artifact_id: light2-harness
    kind: wiring_harness
    identity_scheme: revision
    latest_identity: light2-harness-r01
    status: candidate
    variants:
      - light2
    description: Extender wiring harness for Agon Light 2 GPIO.
    notes:
      - Revision r01 adopts the physically exercised predecessor breadboard pin map as the authoritative first design target.
      - Its forward mapping has inherited qualification evidence; the clean-project combination remains a candidate.
      - The buffered PC0/PC1 UART circuit is the selected first wiring target; predecessor tests deliberately qualified correctness at 115.2 kbaud.
      - Operation at the required 1.152 Mbaud legacy rate, required flow-control behavior, production isolation, power behavior, and final carrier construction remain unqualified.

