<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1220" viewBox="0 0 1500 1220">
  <title>Agon Extender carrier-breakout layout concept</title>
  <desc>Installed component-side view preserving odd-to-EXT2 and even-to-EXT1 routing, canonical signal colors, and a complete vertical SN74HC125N pinout.</desc>
  <defs>
    <style>
      .bg{fill:#fafafa}.board{fill:#eef0f1;stroke:#303438;stroke-width:3}.cell{stroke:#333;stroke-width:1.5}
      .title{font:700 27px sans-serif;fill:#111}.head{font:700 17px sans-serif;fill:#111}.label{font:14px sans-serif;fill:#111}
      .small{font:12px sans-serif;fill:#444}.pin{font:700 13px sans-serif}.wire{fill:none;stroke-width:4}
      .under{fill:none;stroke:#fff;stroke-width:11}.res{fill:#fffaf0;stroke:#8d6e63;stroke-width:2}
      .ic{fill:#222;stroke:#050505;stroke-width:3}.icpin{fill:#e4e4e4;stroke:#333;stroke-width:1.5}
      .note{fill:#fff8d7;stroke:#aa8b22;stroke-width:2}.rail3{fill:none;stroke:#d32f2f;stroke-width:4}.railg{fill:none;stroke:#333;stroke-width:4}
    </style>
  </defs>
  <rect class="bg" width="1500" height="1220"/>
  <text class="title" x="45" y="45">Agon Extender carrier / breakout — installed component-side view</text>
  <text class="small" x="45" y="70">Female Agon receptacle at left; P4 sockets at right. Preserve these banks and do not mirror the underside connector footprint.</text>

  <rect class="board" x="25" y="85" width="1450" height="1095" rx="14"/>

  <!-- Bank titles -->
  <text class="head" x="55" y="120">Agon odd-numbered row</text>
  <text class="small" x="55" y="140">board-right bank → P4 EXT2</text>
  <text class="head" x="1180" y="120">P4 board-right EXT2</text>
  <text class="small" x="1180" y="140">Ethernet end is pin 20</text>

  <!-- Odd-bank cells -->
  <g id="agon-odd-selected">
    <rect class="cell" x="55" y="160" width="275" height="38" rx="4" fill="#fbc02d"/><text class="pin" x="66" y="184">17  PC0 / D0</text>
    <rect class="cell" x="55" y="210" width="275" height="38" rx="4" fill="#f57c00"/><text class="pin" x="66" y="234">19  PC2 / D2</text>
    <rect class="cell" x="55" y="260" width="275" height="38" rx="4" fill="#d32f2f"/><text class="pin" x="66" y="284" fill="#fff">21  PC4 / D4</text>
    <rect class="cell" x="55" y="310" width="275" height="38" rx="4" fill="#6d4c41"/><text class="pin" x="66" y="334" fill="#fff">23  PC6 / D6</text>
    <rect class="cell" x="55" y="360" width="275" height="38" rx="4" fill="#1976d2"/><text class="pin" x="66" y="384" fill="#fff">13  PD4 / READY_N</text>
  </g>
  <g id="p4-ext2-selected">
    <rect class="cell" x="1170" y="160" width="275" height="38" rx="4" fill="#fbc02d"/><text class="pin" x="1181" y="184">11  GPIO22 / D0</text>
    <rect class="cell" x="1170" y="210" width="275" height="38" rx="4" fill="#f57c00"/><text class="pin" x="1181" y="234">10  GPIO23 / D2</text>
    <rect class="cell" x="1170" y="260" width="275" height="38" rx="4" fill="#d32f2f"/><text class="pin" x="1181" y="284" fill="#fff">9  GPIO32 / D4</text>
    <rect class="cell" x="1170" y="310" width="275" height="38" rx="4" fill="#6d4c41"/><text class="pin" x="1181" y="334" fill="#fff">8  GPIO33 / D6</text>
    <rect class="cell" x="1170" y="360" width="275" height="38" rx="4" fill="#1976d2"/><text class="pin" x="1181" y="384" fill="#fff">13  GPIO20 / READY_N</text>
  </g>

  <!-- Straight odd-bank conductors and inline data resistance -->
  <g id="odd-routes">
    <path class="under" d="M330 229 H1170"/><path class="wire" stroke="#f57c00" d="M330 229 H1170"/>
    <path class="under" d="M330 279 H1170"/><path class="wire" stroke="#d32f2f" d="M330 279 H1170"/>
    <path class="under" d="M330 329 H1170"/><path class="wire" stroke="#6d4c41" d="M330 329 H1170"/>
    <path class="under" d="M330 379 H1170"/><path class="wire" stroke="#1976d2" d="M330 379 H1170"/>
    <g><rect class="res" x="482" y="216" width="76" height="26" rx="3"/><text class="small" x="520" y="234" text-anchor="middle">220 Ω</text></g>
    <g><rect class="res" x="482" y="266" width="76" height="26" rx="3"/><text class="small" x="520" y="284" text-anchor="middle">220 Ω</text></g>
    <g><rect class="res" x="482" y="316" width="76" height="26" rx="3"/><text class="small" x="520" y="334" text-anchor="middle">220 Ω</text></g>
    <path class="rail3" d="M1080 350 V395"/><text class="small" x="1070" y="344" text-anchor="end">10 kΩ pull-up to 3.3 V</text>
  </g>

  <!-- Complete SN74HC125N package -->
  <g id="sn74hc125n" transform="translate(565 430)">
    <text class="head" x="185" y="-22" text-anchor="middle">U1 — SN74HC125N</text>
    <rect class="ic" x="90" y="0" width="190" height="330" rx="14"/>
    <path d="M160 0 A25 25 0 0 0 210 0" fill="#fafafa" stroke="#050505" stroke-width="3"/>
    <circle cx="112" cy="28" r="6" fill="#ddd"/>
    <!-- left pins 1 through 7, top to bottom -->
    <g class="label">
      <rect class="icpin" x="25" y="24" width="65" height="30"/><text x="33" y="44"><tspan font-weight="bold">1</tspan>  1OE_N</text>
      <rect class="icpin" x="25" y="68" width="65" height="30"/><text x="33" y="88"><tspan font-weight="bold">2</tspan>  1A</text>
      <rect class="icpin" x="25" y="112" width="65" height="30"/><text x="33" y="132"><tspan font-weight="bold">3</tspan>  1Y</text>
      <rect class="icpin" x="25" y="156" width="65" height="30"/><text x="33" y="176"><tspan font-weight="bold">4</tspan>  2OE_N</text>
      <rect class="icpin" x="25" y="200" width="65" height="30"/><text x="33" y="220"><tspan font-weight="bold">5</tspan>  2A</text>
      <rect class="icpin" x="25" y="244" width="65" height="30"/><text x="33" y="264"><tspan font-weight="bold">6</tspan>  2Y</text>
      <rect class="icpin" x="25" y="288" width="65" height="30"/><text x="33" y="308"><tspan font-weight="bold">7</tspan>  GND</text>
      <!-- right pins 14 through 8, top to bottom -->
      <rect class="icpin" x="280" y="24" width="72" height="30"/><text x="288" y="44"><tspan font-weight="bold">14</tspan> VCC</text>
      <rect class="icpin" x="280" y="68" width="72" height="30"/><text x="288" y="88"><tspan font-weight="bold">13</tspan> 4OE_N</text>
      <rect class="icpin" x="280" y="112" width="72" height="30"/><text x="288" y="132"><tspan font-weight="bold">12</tspan> 4A</text>
      <rect class="icpin" x="280" y="156" width="72" height="30"/><text x="288" y="176"><tspan font-weight="bold">11</tspan> 4Y</text>
      <rect class="icpin" x="280" y="200" width="72" height="30"/><text x="288" y="220"><tspan font-weight="bold">10</tspan> 3OE_N</text>
      <rect class="icpin" x="280" y="244" width="72" height="30"/><text x="288" y="264"><tspan font-weight="bold">9</tspan>  3A</text>
      <rect class="icpin" x="280" y="288" width="72" height="30"/><text x="288" y="308"><tspan font-weight="bold">8</tspan>  3Y</text>
    </g>
  </g>
  <!-- Literal U1 wiring. White underlays keep every crossing legible. -->
  <g id="u1-wiring">
    <!-- Explicit Agon supply pins -->
    <rect class="cell" x="55" y="430" width="275" height="38" rx="4" fill="#d32f2f"/><text class="pin" x="66" y="454" fill="#fff">34  +3.3 V / U1 VCC</text>
    <rect class="cell" x="55" y="730" width="275" height="38" rx="4" fill="#fff"/><text class="pin" x="66" y="754">33  GND / signal ground</text>
    <!-- PC0/D0: Agon pin 17 -> U1 pin 12; U1 pin 11 -> R -> P4 GPIO22 -->
    <path class="under" d="M330 179 H960 V557 H917"/><path class="wire" stroke="#fbc02d" d="M330 179 H960 V557 H917"/>
    <path class="under" d="M917 601 H1030 M1100 601 H1080 V179 H1170"/><path class="wire" stroke="#fbc02d" d="M917 601 H1030 M1100 601 H1080 V179 H1170"/>
    <rect class="res" x="1030" y="588" width="70" height="26" rx="3"/><text class="small" x="1065" y="606" text-anchor="middle">220 Ω</text>

    <!-- PC1 Agon-side node: pin 18 joins U1 pin 2 input and pin 6 output via R -->
    <path class="under" d="M330 859 H440 V513 H590"/><path class="wire" stroke="#808080" d="M330 859 H440 V513 H590"/>
    <path class="under" d="M590 689 H520 M450 689 H440"/><path class="wire" stroke="#808080" d="M590 689 H520 M450 689 H440"/>
    <rect class="res" x="450" y="676" width="70" height="26" rx="3"/><text class="small" x="485" y="694" text-anchor="middle">220 Ω</text>

    <!-- PC1 P4-side node: U1 pin 3 output via R and U1 pin 5 input join GPIO12 -->
    <path class="under" d="M590 557 H520 M450 557 H405 V812 H1040 V859 H1170"/><path class="wire" stroke="#808080" d="M590 557 H520 M450 557 H405 V812 H1040 V859 H1170"/>
    <rect class="res" x="450" y="544" width="70" height="26" rx="3"/><text class="small" x="485" y="562" text-anchor="middle">220 Ω</text>
    <path class="under" d="M590 645 H420 V797 H1020 V859 H1040"/><path class="wire" stroke="#808080" d="M590 645 H420 V797 H1020 V859 H1040"/>

    <!-- Explicit P4 enable pins and their IC destinations -->
    <rect class="cell" x="1090" y="415" width="325" height="38" rx="4" fill="#fff"/><text class="pin" x="1101" y="439">EXT2 12  GPIO21 / REV_OE_N</text>
    <path class="under" d="M1090 434 H1010 V400 H520 V601 H590"/><path class="wire" stroke="#00838f" d="M1090 434 H1010 V400 H520 V601 H590"/>
    <path class="rail3" d="M545 400 V375"/><text class="small" x="555" y="377">10 kΩ pull-up</text>

    <rect class="cell" x="1090" y="740" width="325" height="38" rx="4" fill="#fff"/><text class="pin" x="1101" y="764">EXT1 16  GPIO15 / FWD_OE_N</text>
    <path class="under" d="M1090 759 H985 V513 H917"/><path class="wire" stroke="#ffffff" d="M1090 759 H985 V513 H917"/>
    <path class="under" d="M985 470 H540 V469 H590"/><path class="wire" stroke="#c2185b" d="M985 470 H540 V469 H590"/>
    <path class="rail3" d="M955 470 V445"/><text class="small" x="965" y="447">10 kΩ pull-up</text>

    <!-- Supply, literal bypass connection, and permanently disabled channel 3 -->
    <path class="under" d="M330 449 H380 V365 H940 V469 H917"/><path class="rail3" fill="none" d="M330 449 H380 V365 H940 V469 H917"/>
    <rect class="res" x="1000" y="351" width="75" height="28" rx="3"/><text class="small" x="1037" y="369" text-anchor="middle">100 nF</text>
    <path class="rail3" d="M1000 365 H940"/>
    <path class="under" d="M1075 365 H1120 V790 H555 V733 H590"/><path class="railg" fill="none" d="M1075 365 H1120 V790 H555 V733 H590"/>
    <path class="under" d="M330 749 H555 V733 H590"/><path class="railg" fill="none" d="M330 749 H555 V733 H590"/>
    <path class="rail3" d="M917 645 H940 V620"/><text class="small" x="950" y="622">10 kΩ pull-up: CH3 disabled</text>
    <path class="railg" d="M917 689 H940 V790 H800"/><text class="small" x="950" y="716">pin 9 to GND</text>
    <path d="M917 733 H950" stroke="#555" stroke-width="2"/><text class="small" x="958" y="737">pin 8 NC / test pad</text>
  </g>

  <!-- Even bank -->
  <text class="head" x="55" y="805">Agon even-numbered row</text>
  <text class="small" x="55" y="825">board-left bank → P4 EXT1</text>
  <text class="head" x="1180" y="805">P4 board-left EXT1</text>
  <text class="small" x="1180" y="825">Ethernet end is pin 20</text>
  <g id="agon-even-selected">
    <rect class="cell" x="55" y="840" width="275" height="38" rx="4" fill="#808080"/><text class="pin" x="66" y="864" fill="#fff">18  PC1 / D1</text>
    <rect class="cell" x="55" y="890" width="275" height="38" rx="4" fill="#7b1fa2"/><text class="pin" x="66" y="914" fill="#fff">20  PC3 / D3</text>
    <rect class="cell" x="55" y="940" width="275" height="38" rx="4" fill="#1976d2"/><text class="pin" x="66" y="964" fill="#fff">22  PC5 / D5</text>
    <rect class="cell" x="55" y="990" width="275" height="38" rx="4" fill="#388e3c"/><text class="pin" x="66" y="1014" fill="#fff">24  PC7 / D7</text>
    <rect class="cell" x="55" y="1040" width="275" height="38" rx="4" fill="#111"/><text class="pin" x="66" y="1064" fill="#fff">14  PD5 / CLOCK</text>
    <rect class="cell" x="55" y="1090" width="275" height="38" rx="4" fill="#fff"/><text class="pin" x="66" y="1114">16  PD7 / VALID_N</text>
  </g>
  <g id="p4-ext1-selected">
    <rect class="cell" x="1170" y="840" width="275" height="38" rx="4" fill="#808080"/><text class="pin" x="1181" y="864" fill="#fff">13  GPIO12 / D1</text>
    <rect class="cell" x="1170" y="890" width="275" height="38" rx="4" fill="#7b1fa2"/><text class="pin" x="1181" y="914" fill="#fff">12  GPIO11 / D3</text>
    <rect class="cell" x="1170" y="940" width="275" height="38" rx="4" fill="#1976d2"/><text class="pin" x="1181" y="964" fill="#fff">11  GPIO10 / D5</text>
    <rect class="cell" x="1170" y="990" width="275" height="38" rx="4" fill="#388e3c"/><text class="pin" x="1181" y="1014" fill="#fff">10  GPIO9 / D7</text>
    <rect class="cell" x="1170" y="1040" width="275" height="38" rx="4" fill="#111"/><text class="pin" x="1181" y="1064" fill="#fff">15  GPIO14 / CLOCK</text>
    <rect class="cell" x="1170" y="1090" width="275" height="38" rx="4" fill="#fff"/><text class="pin" x="1181" y="1114">14  GPIO13 / VALID_N</text>
  </g>
  <g id="even-routes">
    <path class="under" d="M330 909 H1170"/><path class="wire" stroke="#7b1fa2" d="M330 909 H1170"/>
    <path class="under" d="M330 959 H1170"/><path class="wire" stroke="#1976d2" d="M330 959 H1170"/>
    <path class="under" d="M330 1009 H1170"/><path class="wire" stroke="#388e3c" d="M330 1009 H1170"/>
    <path class="under" d="M330 1059 H1170"/><path class="wire" stroke="#111" d="M330 1059 H1170"/>
    <path class="under" d="M330 1109 H1170"/><path class="wire" stroke="#fff" d="M330 1109 H1170"/><path fill="none" stroke="#555" stroke-width="1.5" d="M330 1109 H1170"/>
    <g><rect class="res" x="482" y="896" width="76" height="26" rx="3"/><text class="small" x="520" y="914" text-anchor="middle">220 Ω</text></g>
    <g><rect class="res" x="482" y="946" width="76" height="26" rx="3"/><text class="small" x="520" y="964" text-anchor="middle">220 Ω</text></g>
    <g><rect class="res" x="482" y="996" width="76" height="26" rx="3"/><text class="small" x="520" y="1014" text-anchor="middle">220 Ω</text></g>
    <text class="small" x="1000" y="1047">10 kΩ pull-down</text><path class="railg" d="M1080 1059 V1080"/>
    <text class="small" x="995" y="1150">10 kΩ pull-up to 3.3 V</text><path class="rail3" d="M1080 1109 V1140"/>
  </g>

  <text class="small" x="55" y="1160">Canonical colors identify logical lines. Probe-to-net assignments remain test-specific.</text>
</svg>
