schema_version: 1
model:
  model_id: light2-harness-r03
  title: Light 2 direct Port C harness — Exclusive Compatible draft
  status: draft
  authority: true
  scope: Draft of the Author-reported eight direct Port C lanes, 220-ohm series resistors and 15k Agon-rail
    pull-ups; initial UART-only review.
  source_refs:
  - docs/tasks/HW-002.md
  - hardware/designs/light2-harness-r01/legacy-evidence/wiring-diagram.svg
  - hardware/designs/light2-harness-r02/connectivity.yaml
  notes: This is a draft electrical definition, not a verified as-built record or qualified circuit. The
    reference pin map, Agon-side pull-up junction placement and common ground require assembly confirmation.
    PC4-PC7 remain connected but are unused for the UART milestone. The onboard VDP retains its existing
    VSync/PB1 connection; no P4 timing wire is added.
