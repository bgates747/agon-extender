  outcome: pass
  summary: >-
    A coherent second P4 external-ZDI capture reproduced the original failed
    EMOS startup and read UART0's divisor as 0x000B in the same halt epoch.
    That value exactly matches a 24-bit intermediate overflow in the AgonDev
    build and identifies the immediate physical boot blocker. This passes the
    bounded root-cause discriminator but is not qualification evidence.

