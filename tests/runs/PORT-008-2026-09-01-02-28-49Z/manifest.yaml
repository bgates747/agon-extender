legacy_startup_audit:
  established:
    - Stock VDP synchronization, MOS banner, SD mount, and sysvar setup precede emos_init.
    - emos_init selects Legacy, onboard VDP route 0, and inactive EDU state.
    - EMOS acquires Port C and Port D only after the explicit EMOS MODE EXTENDED command.
    - A failed prepare restores the saved GPIO state and does not commit the VDU route.
    - P4 reverse output remained disabled during the capture.
  defect:
    - >-
      P4 arms its receiver and asserts READY_N during P4 startup rather than in
      response to a bounded EMOS activation request.

claim_boundary:
  established:
    - EMOS did not silently reroute ordinary Legacy startup through PORT-008.
    - Browser WebSocket connection state does not control P4 parallel ingress.
    - The cadence-corrected sender did not produce a complete sampled record.
    - The present P4 pre-activation READY_N behavior violates strict Legacy electrical absence.
  failed:
    - General Poll record completion
    - READY_N release
    - Exclusive Extended route commitment
    - Visible fixture execution
  not_claimed:
    - Cause of the missing physical CLOCK transitions
    - Safety or correctness of an unapproved replacement activation handshake
    - Browser frame, reverse UART, sysvar, r02/V1, or broad compatibility behavior
