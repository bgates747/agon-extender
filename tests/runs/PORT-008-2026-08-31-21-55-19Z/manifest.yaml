  outcome: pass
  summary: >-
    A temporary P4 external-ZDI observer captured the original
    VDP-banner/no-MOS-banner failure with the stock onboard VDP still running.
    The eZ80 was executing EMOS's General Poll wait path, gp remained zero,
    Timer 0 had reached zero, and UART0 had no received byte. This passes the
    bounded capture objective but does not identify the electrical or software
    root cause and is not qualification evidence.

