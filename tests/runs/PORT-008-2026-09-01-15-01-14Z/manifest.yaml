claim_boundary:
  established:
    - No D4 source-side CLOCK transition was sampled during the ten-second capture under the actual connected-READY wiring.
    - No D5 destination-side CLOCK transition was sampled after Agon power-on under the actual connected-READY wiring.
    - D4 and D5 were logically equal throughout the post-trigger interval under the actual connected-READY wiring.
    - The failed mode request did not commit the route or execute P8VDU.BIN.
  invalidating_condition:
    - >-
      The intended READY-isolated temporary fixture was not established; the
      run cannot exercise or select a branch of that discriminator.
  not_claimed:
    - Behavior EMOS would have exhibited with READY_N actually isolated
    - A discriminator result among eZ80 GPIO configuration, source probe
      contact, wiring, or another source-side electrical condition
    - A cause for the D3/D6 sub-microsecond low spans on the connected nets
    - P4 receiver correctness, completed forward transfer, reverse UART,
      mode commitment, browser frame, sysvars, r02/V1, or compatibility behavior
