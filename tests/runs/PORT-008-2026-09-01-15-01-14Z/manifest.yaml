observations:
  - requirement: p4-readiness
    observed: Unique P4 USB identity matched and plain HTTP returned status 200.
    result: pass
  - requirement: analyzer-readiness
    observed: Unique eight-channel analyzer matched and advertised 24 MHz support.
    result: pass
  - requirement: mode-request
    observed: >-
      MOS reported autoexec line 1 error followed by Error accessing SD card.
      EMOS status 1 is the READY-admission timeout but shares the FatFS result
      domain where value 1 renders as FR_DISK_ERR.
    result: expected-timeout
  - requirement: source-clock
    observed: >-
      D4 at Agon header pin 14 / eZ80 PD5 remained low for all 240000000 samples.
    result: absent
  - requirement: destination-clock
    observed: >-
      D5 at P4 GPIO14 had no post-trigger edge and remained low throughout the
      mode attempt.
    result: absent
  - requirement: source-destination-agreement
    observed: D4 and D5 matched for every post-trigger sample.
    result: pass
  - requirement: ready-observation
    observed: >-
      D6 contained three post-trigger low spans totaling 14 samples: 0.083 us,
      0.417 us, and 0.083 us.
    result: observed-on-connected-live-net
  - requirement: no-valid-record
    observed: >-
      D3 contained two brief post-trigger low spans but no bounded transfer record.
    result: pass-with-glitches
  - requirement: forward-direction-context
    observed: D7 / FWD_OE_N remained low for the complete capture.
    result: observed
  - requirement: visible-fixture
    observed: P8VDU.BIN did not execute because autoexec stopped at line 1.
    result: not-reached

