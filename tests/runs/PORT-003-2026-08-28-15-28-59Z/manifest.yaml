  identity: p4-browser-video-qualification-r01
  deviations:
    - >-
      The first remote flash wrapper was malformed by command-shell quoting and
      exited before esptool received a valid device or performed a mutation.
      The operation was repeated with a literal fail-closed remote script.
    - >-
      The first post-flash serial attempt began with buffered partial boot
      output and did not reset the P4 as intended. It remains preserved as a
      separate raw segment. A subsequent esptool reset plus immediate
      reconnect captured application startup and identity without
      joining the two segments.

