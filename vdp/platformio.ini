[platformio]
# This project deliberately keeps the official agon-vdp source-root name.
# PlatformIO would otherwise expect src/, which would needlessly diverge from
# upstream and complicate future source comparisons.
default_envs = p4-canary
src_dir = video
boards_dir = boards

[env:p4-canary]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
# SETUP-003's protected upstream-control build and this P4 environment require
# incompatible Arduino cores under PlatformIO's global package name. Pinning
# the constituent core prevents whichever build ran last from silently making
# the other environment resolve the wrong installed package.
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
board = olimex_esp32_p4_devkit
framework = arduino, espidf
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions.csv
# Important: board_build.partitions controls PlatformIO's packaging, while the
# matching ESP-IDF flash manifest is selected separately in sdkconfig.defaults.
# Omitting either side produced conflicting 0x10000/0x20000 application offsets.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D AGON_EXTENDER_CANARY=1

[env:p4-display-contract-canary]
extends = env:p4-canary
# Phase A proves only the retained Canvas/controller type-and-link boundary.
# The official firmware tree is present for provenance but deliberately absent
# from this source filter; full facade integration belongs to Phase E.
build_src_filter =
    -<*>
    +<extender/canary/display_contract_canary.cpp>
    +<extender/display/p4_display_controller.cpp>
    +<extender/port/fabutils_port.cpp>
extra_scripts =
    pre:pio/select_sources.py
build_flags =
    ${env:p4-canary.build_flags}
    -D AGON_EXTENDER_DISPLAY_CONTRACT_CANARY=1
    -I video/extender/compat
    -I vendor/vdp-gl/src
    -include video/extender/compat/p4_vdp_gl_architecture.hpp
