[platformio]
# This project deliberately keeps the official agon-vdp source-root name.
# PlatformIO would otherwise expect src/, which would needlessly diverge from
# upstream and complicate future source comparisons.
default_envs = p4-canary
src_dir = video
boards_dir = boards
# Tool packages are project-local because PlatformIO cannot reliably coexist
# with the official VDP checkout's Arduino 2.x package under its global package
# name. Keeping the P4 tool closure under ignored .pio/ prevents one project's
# build from silently replacing the other's framework between invocations.
packages_dir = .pio/packages

[env:p4-canary]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
# SETUP-003's protected upstream-control build and this P4 environment require
# incompatible Arduino cores under PlatformIO's global package name. Pinning
# the constituent core prevents whichever build ran last from silently making
# the other environment resolve the wrong installed package.
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
board = olimex_esp32_p4_devkit
framework = arduino, espidf
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions.csv
# Important: board_build.partitions controls PlatformIO's packaging, while the
# matching ESP-IDF flash manifest is selected separately in sdkconfig.defaults.
# Omitting either side produced conflicting 0x10000/0x20000 application offsets.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D AGON_EXTENDER_CANARY=1

[env:p4-uart-forward]
extends = env:p4-canary
# PORT-009 isolated RX-only diagnostic; no retained VDP or parallel code.
# scripts/prepare_uart_forward.py supplies the shared generated test identity.
build_src_filter =
    -<*>
    +<extender/diagnostic/uart_forward_receiver.cpp>
extra_scripts =
    pre:pio/select_sources.py

[env:p4-display-renderer]
extends = env:p4-canary
# Phase B proves the retained Canvas/controller synchronous renderer boundary.
# The official firmware tree is present for provenance but deliberately absent
# from this source filter; full facade integration belongs to Phase E.
build_src_filter =
    -<*>
    +<extender/canary/display_renderer_canary.cpp>
    +<extender/display/native_pixel_codec.cpp>
    +<extender/display/palette_state.cpp>
    +<extender/display/plane_storage.cpp>
    +<extender/display/presentation_compositor.cpp>
    +<extender/display/presentation_snapshot_pool.cpp>
    +<extender/display/p4_display_controller.cpp>
    +<extender/port/fabutils_port.cpp>
extra_scripts =
    pre:pio/select_sources.py
build_flags =
    ${env:p4-canary.build_flags}
    -D AGON_EXTENDER_DISPLAY_RENDERER=1
    -I video/extender/compat
    -I vendor/vdp-gl/src
    -include video/extender/compat/p4_vdp_gl_architecture.hpp

[env:p4-frame-service]
extends = env:p4-display-renderer
# Phase C adds sink-independent logical time, frame-boundary work, swaps, and
# metadata publication. It deliberately selects no physical output driver.
build_src_filter =
    -<*>
    +<extender/canary/frame_service_canary.cpp>
    +<extender/display/logical_frame_service.cpp>
    +<extender/display/p4_frame_service.cpp>
    +<extender/display/native_pixel_codec.cpp>
    +<extender/display/palette_state.cpp>
    +<extender/display/plane_storage.cpp>
    +<extender/display/presentation_compositor.cpp>
    +<extender/display/presentation_snapshot_pool.cpp>
    +<extender/display/p4_display_controller.cpp>
    +<extender/port/fabutils_port.cpp>
extra_scripts =
    pre:pio/select_sources.py
    pre:pio/build_identity.py
build_flags =
    ${env:p4-display-renderer.build_flags}
    -D AGON_EXTENDER_FRAME_SERVICE=1

[env:p4-presentation]
extends = env:p4-frame-service
# Phase D adds palette/Copper state and sink-neutral RGB888 composition. This
# compile-only diagnostic owns no physical output or frame-consumer contract.
build_src_filter =
    -<*>
    +<extender/canary/presentation_canary.cpp>
    +<extender/display/logical_frame_service.cpp>
    +<extender/display/p4_frame_service.cpp>
    +<extender/display/native_pixel_codec.cpp>
    +<extender/display/palette_state.cpp>
    +<extender/display/plane_storage.cpp>
    +<extender/display/presentation_compositor.cpp>
    +<extender/display/presentation_snapshot_pool.cpp>
    +<extender/display/p4_display_controller.cpp>
    +<extender/port/fabutils_port.cpp>
extra_scripts =
    pre:pio/select_sources.py
build_flags =
    ${env:p4-frame-service.build_flags}
    -D AGON_EXTENDER_PRESENTATION=1

[env:p4-official-display]
extends = env:p4-presentation
# Phase E compiles the adapted official screen facade and retained Teletext over
# the sink-free P4 logical backend. This remains a compile/link diagnostic: it
# has no VDU transport, input driver, output consumer, or deployment identity.
build_src_filter =
    -<*>
    +<extender/canary/official_display_canary.cpp>
    +<extender/display/cursor_position_adapter.cpp>
    +<extender/display/logical_frame_service.cpp>
    +<extender/display/p4_frame_service.cpp>
    +<extender/display/native_pixel_codec.cpp>
    +<extender/display/palette_state.cpp>
    +<extender/display/plane_storage.cpp>
    +<extender/display/presentation_compositor.cpp>
    +<extender/display/presentation_snapshot_pool.cpp>
    +<extender/display/p4_display_controller.cpp>
    +<extender/display/screen_facade_adapter.cpp>
    +<extender/display/screen_facade_p4_binding.cpp>
    +<extender/port/fabutils_port.cpp>
extra_scripts =
    pre:pio/select_sources.py
build_flags =
    ${env:p4-presentation.build_flags}
    -D AGON_EXTENDER_OFFICIAL_DISPLAY=1

[env:p4-network-service]
extends = env:p4-canary
# PORT-006 first-tranche compile/link diagnostic. It binds the real immutable
# snapshot/EVF1 provider to the real wired service, but publishes no frame and
# is not a deployment-qualified retained VDP image.
build_src_filter =
    -<*>
    +<extender/canary/network_service_canary.cpp>
    +<extender/display/presentation_snapshot_pool.cpp>
    +<extender/network/opaque_message.cpp>
    +<extender/network/browser_video_service_core.cpp>
    +<extender/network/wired_network_service.cpp>
    +<extender/web/browser_video_provider.cpp>
    +<extender/web/embedded_assets.cpp>
extra_scripts =
    pre:pio/select_sources.py
    pre:pio/build_identity.py
build_flags =
    ${env:p4-canary.build_flags}
    -D AGON_EXTENDER_NETWORK_SERVICE=1

[env:p4-browser-vdp]
extends = env:p4-official-display
# Phase F's first bootable retained-port target. It compiles the official
# Arduino lifecycle and header-defined parser through bounded P4 adapters,
# serves immutable snapshots over onboard Ethernet, and deliberately supplies
# no physical VDU ingress, input device, audio sink, or return transport.
build_src_filter =
    -<*>
    +<extender/boot/p4_browser_vdp.cpp>
    +<extender/display/cursor_position_adapter.cpp>
    +<extender/display/logical_frame_service.cpp>
    +<extender/display/native_pixel_codec.cpp>
    +<extender/display/p4_display_controller.cpp>
    +<extender/display/p4_frame_service.cpp>
    +<extender/display/palette_state.cpp>
    +<extender/display/plane_storage.cpp>
    +<extender/display/presentation_compositor.cpp>
    +<extender/display/presentation_snapshot_pool.cpp>
    +<extender/display/screen_facade_adapter.cpp>
    +<extender/display/screen_facade_p4_binding.cpp>
    +<extender/network/browser_video_service_core.cpp>
    +<extender/network/opaque_message.cpp>
    +<extender/network/wired_network_service.cpp>
    +<extender/port/fabutils_port.cpp>
    +<extender/port/p4_task_watchdog.cpp>
    +<extender/transport/disconnected_stream.cpp>
    +<extender/web/browser_video_provider.cpp>
    +<extender/web/embedded_assets.cpp>
extra_scripts =
    pre:pio/select_sources.py
    pre:pio/build_identity.py
build_flags =
    ${env:p4-official-display.build_flags}
    -D AGON_EXTENDER_P4_BOOT=1
    -I vendor/ESP32Time

[env:p4-forward-vdp]
extends = env:p4-browser-vdp
# REJECTED/SUPERSEDED PORT-008 r01 predecessor.  The source-selection hook
# deliberately refuses this environment; it remains named only so old build
# commands fail with an explicit disposition instead of silently selecting the
# boot-active, discard-success ForwardParallelStream prototype.
build_src_filter =
    ${env:p4-browser-vdp.build_src_filter}
    -<extender/transport/disconnected_stream.cpp>
    +<extender/transport/forward_parallel_stream.cpp>
build_flags =
    ${env:p4-browser-vdp.build_flags}
    -D AGON_EXTENDER_PORT008_FORWARD=1

[env:p4-port008-nonrelease-qualification]
extends = env:p4-browser-vdp
# PORT-008-D002 compile/link composition of the production forward-parallel
# data plane with the real retained parser/display/browser closure. This target
# has a qualification-only fixed epoch and visible bounded return capture. Its
# identity is generated only for the boot translation unit and remains
# unversioned unless the operator supplies an approved identity; the target has
# no activation grammar, UART return, deployment authorization, or physical-use
# claim.
build_src_filter =
    ${env:p4-browser-vdp.build_src_filter}
    -<extender/boot/p4_browser_vdp.cpp>
    +<extender/boot/p4_parallel_qualification_vdp.cpp>
    -<extender/transport/disconnected_stream.cpp>
    +<extender/transport/p4_parallel_data_plane.cpp>
    +<extender/transport/extender_vdp_stream.cpp>
    +<extender/transport/p4_parallel_target.cpp>
    +<extender/transport/p4_parallel_qualification.cpp>
extra_scripts =
    pre:pio/build_identity.py
    pre:pio/select_sources.py
    pre:pio/capture_p4_actual_steps.py

[env:p4-zdi-probe]
extends = env:p4-canary
# RETIRED PORT-008 diagnostic tombstone. The source-selection hook rejects this
# environment before it can rebuild the old external ZDI observer. It remains
# named only so historical commands fail with an explicit disposition.
build_src_filter =
    -<*>
    +<extender/diagnostic/p4_zdi_probe.cpp>
extra_scripts =
    pre:pio/select_sources.py
build_flags =
    ${env:p4-canary.build_flags}
    -D AGON_EXTENDER_P4_ZDI_PROBE=1
    # Bench-only workaround: USB Serial/JTAG output is proven, but host input
    # did not reach this diagnostic. The source still enforces identity and
    # pre-halt state gates before its delayed one-shot capture.
    -D AGON_EXTENDER_P4_ZDI_AUTO_CAPTURE=1
    # A separately gated supplement may inspect the divisor of the exact
    # already-captured candidate without resuming or re-halting the eZ80.
    -D AGON_EXTENDER_P4_ZDI_HALTED_SUPPLEMENT=1

[env:p4-zdi-mos-recovery]
extends = env:p4-canary
# RETIRED PORT-008 recovery tombstone. The source-selection hook rejects this
# environment before it can rebuild the old one-shot eZ80 flash writer. It
# remains named only so historical commands fail with an explicit disposition.
build_src_filter =
    -<*>
    +<extender/diagnostic/p4_zdi_mos_recovery.cpp>
extra_scripts =
    pre:pio/select_sources.py
build_flags =
    ${env:p4-canary.build_flags}
    -D AGON_EXTENDER_P4_ZDI_MOS_RECOVERY=1
